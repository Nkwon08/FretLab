                      </h3>
                      {selectedChord && (
                        <button onClick={() => setSelectedChord(null)} className="fl-btn h-8 px-3.5 text-[12.5px]">
                          ✕ Clear selection
                        </button>
                      )}
                    </div>
                    <div className="chord-grid">
                      {buildDiatonicChords.map((ch) => {
                        const isSel = selectedChord && selectedChord.name === ch.name;
                        return (
                          <button type="button"
                            key={`${ch.degree}-${ch.name}`}
                            onClick={() => setSelectedChord(isSel ? null : ch)}
                            aria-pressed={Boolean(isSel)}
                            className="fl-card chord-option"
                          >
                            <div className="fl-label">{romanForChord(ch)}</div>
                            <div className="font-semibold text-base text-[#eceee8] mt-0.5 mb-2">{ch.name}</div>
                            <div className="flex gap-1">
                              {ch.pcs.map((pc, idx) => {
                                const c = idx === 0 ? rootColor : (idx === 1 ? thirdColor : noteColor);
                                return (
                                  <div key={idx} className="w-[19px] h-[19px] rounded-full grid place-items-center text-[9px] font-semibold"
                                    style={{ backgroundColor: c, color: isLightColor(c) ? '#2b1f10' : '#fff8ec' }}>
                                    {noteNames[pc]}
                                  </div>
                                );
                              })}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Saved fretboard notes */}
                  <div className="saved-section">
                    <div className="flex items-center justify-between mb-3">
                      <div className="font-semibold text-[#eceee8]">Saved fretboard notes</div>
                      <div className="text-xs text-[#929e92]">Tap a saved set to load it.</div>
                    </div>
                    {savedDrawings.length === 0 ? (
                      <div className="text-sm text-[#b1b9af]">No saved notes yet. Turn on Select, choose notes, then press Save.</div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {savedDrawings.map((preset) => {
                          const count = Object.keys(preset.data || {}).length;
                          return (
                            <div key={preset.id} className="saved-pattern">
                              <button type="button" onClick={() => loadSavedDrawing(preset.id)}>
                                <span className="block font-semibold text-sm truncate">{preset.name}</span>
                                <span className="block text-xs mt-1 text-[#b1b9af]">{count} note{count === 1 ? '' : 's'} · {preset.root || rootNote} {scaleNames[preset.scale] || scaleNames[scaleType]}</span>
                              </button>
                              <button type="button" aria-label={`Delete ${preset.name}`} onClick={() => deleteSavedDrawing(preset.id)} className="fl-btn h-9 px-3">Delete</button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ---------------- Tuner ---------------- */}
              {page === 'Tuner' && (
                <div className="page">
                  <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <div className="flex flex-wrap items-center gap-4">
                      <div><h1>Chromatic tuner</h1><p className="page-description">Play one open string at a time.</p></div>
                      <div className="fl-switch h-8 items-center">
                        <button className={`px-3.5 h-full text-xs ${autoDetectString ? 'on' : ''}`} aria-pressed={autoDetectString} onClick={() => setAutoDetectString(true)}>Auto detect</button>
                        <button className={`px-3.5 h-full text-xs ${!autoDetectString ? 'on' : ''}`} aria-pressed={!autoDetectString} onClick={() => setAutoDetectString(false)}>Manual</button>
                      </div>
                    </div>
                    {!isTunerOn ? (
                      <button onClick={startTuner} className="fl-btn-primary h-10 px-6 text-sm">● Start tuning</button>
                    ) : (
                      <button onClick={stopTuner} className="fl-btn-danger h-10 px-6 text-sm">■ Stop</button>
                    )}
                  </div>

                  {tunerError && (
                    <div role="alert" className="border border-[#9a3412] bg-[#2b1410] text-[#fca5a5] rounded p-3 mb-4 text-sm">
                      Microphone error: {tunerError}
                    </div>
                  )}

                  <div className="fl-panel tuner-workspace">
                    <div className="flex flex-col items-center justify-center py-5">
                      <div className="relative w-64 max-w-full h-32">
                        <div className="absolute inset-0 flex items-end justify-center">
                          <div className="text-xs text-[#929e92]">-50¢</div>
                          <div className="flex-1" />
                          <div className="text-xs text-[#929e92]">+50¢</div>
                        </div>
                        <div className="absolute left-1/2 bottom-0 -translate-x-1/2 w-8 h-24 bg-green-500/20 rounded" />
                        <div
                          className="absolute left-1/2 bottom-0 -translate-x-1/2 w-1 h-24 bg-[#e0c48e] origin-bottom rounded "
                          style={{ transform: `translateX(-50%) rotate(${(tunerCents / 50) * 45}deg)` }}
                        />
                        <div className="absolute left-0 right-0 bottom-0 h-1.5 bg-[#343a35] rounded" />
                      </div>
                      <div className="mt-6 text-center">
                        <div className="fl-label">Detected</div>
                        <div className="text-[#eceee8] text-5xl font-semibold leading-tight">{tunerNote}</div>
                        <div className="text-sm mt-1 text-[#b1b9af]">{tunerFreq ? tunerFreq.toFixed(1) + ' Hz' : '--'}</div>
                        <div className={`mt-2 text-sm font-bold ${!isTunerOn || !tunerFreq ? 'text-[#b1b9af]' : Math.abs(tunerCents) <= 5 ? 'text-green-400' : 'text-[#e0c48e]'}`}>
                          {!isTunerOn ? 'Start tuning to enable your microphone' : !tunerFreq ? 'Listening — play an open string' : Math.abs(tunerCents) <= 5 ? 'In tune' : tunerCents < 0 ? `${Math.abs(tunerCents)}¢ flat` : `${tunerCents}¢ sharp`}
                        </div>
                        <div className="mt-4 flex flex-col items-center gap-1.5">
                          <div className="text-sm font-bold text-[#eceee8]">
                            Target: <span className="text-[#e0c48e]">{tuningPresets[tuning][selectedString]}</span>
                          </div>
                          <div className="w-40 h-2 rounded-full overflow-hidden bg-[#191c19] border border-[#343a35]">
                            {(() => {
                              const start = stringHoldStart;
                              const progress = stringConfirmed ? 1 : (start ? Math.min(1, (performance.now() - start) / 3000) : 0);
                              const barColor = stringConfirmed ? 'bg-green-500' : 'bg-[#d6b577]';
                              return <div className={`${barColor} h-full transition-[width]`} style={{ width: `${progress * 100}%` }} />;
                            })()}
                          </div>
                        </div>
                      </div>
                    </div>
                    <div className="tuner-settings space-y-3">
                      <div className="fl-label">Tuning</div>
                      <select
                        aria-label="Tuning" value={tuning}
                        onChange={(e) => setTuning(e.target.value)}
                        className="fl-input w-full h-9 px-3 text-sm"
                      >
                        <option value="standard">Standard (E A D G B E)</option>
                        <option value="dropD">Drop D (D A D G B E)</option>
                        <option value="halfStepDown">Half-step Down (D# G# C# F# A# D#)</option>
                      </select>

                      <div className="fl-label mt-5">Reference strings · low to high</div>
                      <div className="string-grid">
                        {tuningPresets[tuning].map((open, idx) => (
                          <button type="button" key={idx} className="string-key" aria-pressed={idx === selectedString}
                            aria-label={`String ${6 - idx}, ${open}, play reference tone`}
                            onClick={() => { setSelectedString(idx); playStringSound(idx); }}>
                            <small>STRING {6 - idx}</small><strong>{open}</strong>
                          </button>
                        ))}
                      </div>
                      <div className="text-xs text-[#929e92] leading-relaxed">
                        Tap a string to hear its reference tone. Hold a string in tune for 3 seconds to lock it in.
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ---------------- Jam Mode ---------------- */}
              {page === 'Jam Mode' && (
                <div className="page">
                  <div className="page-heading"><div><h1>Jam Mode</h1><p className="page-description">Record a phrase, shape the loop, and keep playing.</p></div><span className="fl-label">4/4 time</span></div>

                  {isCountdownActive && countdown !== null && (
                    <div className="fixed inset-0 z-40 pointer-events-none flex items-center justify-center">
                      <div role="status" className="text-[8rem] md:text-[10rem] font-semibold text-[#e0c48e] bg-[#171918]/95 px-10 rounded-md">
                        {countdown}
                      </div>
                    </div>
                  )}

                  <div className="jam-settings">
                    <section>
                      <div className="fl-label mb-2">Key</div>
                      <select
                        aria-label="Key" value={selectedKey}
                        onChange={(e) => setSelectedKey(e.target.value)}
                        className="fl-input w-full h-10 px-3 text-sm"
                        disabled={isRecording || isCountdownActive}
                      >
                        {noteNames.map((key) => <option key={key} value={key}>{key}</option>)}
                      </select>
                      <div className="fl-label mt-5 mb-2">Chord progression</div>
                      <select
                        aria-label="Chord progression" value={selectedProgression ?? ''}
                        onChange={(e) => setSelectedProgression(e.target.value === '' ? null : parseInt(e.target.value))}
                        className="fl-input w-full h-10 px-3 text-sm"
                      >
                        <option value="">None</option>
                        {chordProgressions.map((prog, idx) => <option key={idx} value={idx}>{prog.name}</option>)}
                      </select>
                      {selectedProgression !== null && chordProgressions[selectedProgression].romans.length > 0 && (
                        <div className="mt-3.5 flex flex-wrap gap-2">
                          {chordsForProgression(selectedKey, chordProgressions[selectedProgression].romans).map((chord, idx) => (
                            <div key={idx} className="fl-card px-3.5 py-1.5 font-bold text-[#eceee8] text-sm">
                              {chord}
                            </div>
                          ))}
                        </div>
                      )}
                    </section>

                    <section>
                      <div className="fl-label mb-3">Click track</div>
                      <div className="flex flex-wrap items-center gap-4 mb-4">
                        <Knob value={bpm} min={20} max={300} />
                        <input
                          aria-label="Tempo in BPM" type="number" min={20} max={300} value={bpm}
                          onChange={(e) => {
                            const v = Math.max(20, Math.min(300, Number(e.target.value) || 0));
                            setBpm(v);
                          }}
                          className="fl-input h-10 w-24 px-3 text-sm text-center font-semibold"
                        />
                        <div className="fl-switch h-9 items-center">
                          <button className={`px-4 h-full text-xs ${isMetronomeEnabled ? 'on' : ''}`} aria-pressed={isMetronomeEnabled} onClick={() => setIsMetronomeEnabled(true)}>On</button>
                          <button className={`px-4 h-full text-xs ${!isMetronomeEnabled ? 'on' : ''}`} aria-pressed={!isMetronomeEnabled} onClick={() => setIsMetronomeEnabled(false)}>Off</button>
                        </div>
                      </div>
                      <div className="text-sm text-[#b1b9af]">1 bar count-in at {bpm} BPM{isMetronomeEnabled ? ', click while recording' : ''}.</div>
                    </section>
                  </div>

                  <div className="mt-4 w-full max-w-2xl mx-auto text-center h-5">
                    {isLoopProcessing && (
                      <div className="text-sm font-bold text-[#e0c48e]">Quantizing…</div>
                    )}
                    {!isLoopProcessing && loopQuantizeInfo && (
                      <div className="text-sm text-[#b1b9af]">
                        {loopQuantizeInfo.beats} beat{loopQuantizeInfo.beats === 1 ? '' : 's'} @ {loopQuantizeInfo.bpm} BPM
                      </div>
                    )}
                  </div>

                  <div className="transport">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4"><div className="fl-label">Transport</div><span className="text-xs text-[#b1b9af]" role="status">{isRecording ? 'Recording in progress' : isCountdownActive ? 'Get ready…' : recordedAudio ? `${audioDuration.toFixed(2)}s recorded` : 'Ready to record'}</span></div>
                    <div className="transport-controls">
                    <button
                      onClick={() => (isRecording || isCountdownActive) ? stopRecording() : startRecording()}
                      className={`h-12 px-8 rounded text-[15px] ${(isRecording || isCountdownActive) ? 'fl-btn-danger' : 'fl-btn-primary'}`}
                      disabled={isCropping || isLoopProcessing}
                    >
                      {isCountdownActive ? '⏹ Cancel countdown' : isRecording ? '⏹ Stop recording' : '● Start recording'}
                    </button>

                    <div className="transport-secondary">
                      <button
                        onClick={() => isPlaying ? stopPlayback() : playRecordedAudio()}
                        disabled={!recordedAudio}
                        className={`h-10 px-5 rounded ${isPlaying ? 'fl-btn-danger' : 'fl-btn'}`}
                      >
                        {isPlaying ? '⏸ Stop' : '▶ Play'}
                      </button>
                      <button
                        aria-pressed={isLooping} onClick={() => { const nl = !isLooping; setIsLooping(nl); jamModeRef.current.shouldLoop = nl; }}
                        disabled={!recordedAudio}
                        className={`h-10 px-5 rounded ${isLooping ? 'fl-btn-primary' : 'fl-btn'}`}
                      >
                        {isLooping ? 'Looping' : 'Loop'}
                      </button>
                      <button
                        aria-expanded={showCropUI} onClick={() => setShowCropUI(!showCropUI)}
                        disabled={!recordedAudio}
                        className={`h-10 px-5 rounded ${showCropUI ? 'fl-btn-primary' : 'fl-btn'}`}
                      >
                        Edit
                      </button>
                      <button
                        onClick={() => saveLoopToDb()}
                        disabled={!recordedAudio}
                        className="fl-btn h-10 px-5 rounded"
                      >
                        Save loop
                      </button>
                    </div>
                  </div>

                  {!recordedAudio && <p className="empty-state">Your loop will appear here. Recording starts after a one-bar count-in.</p>}
                  </div>
                  {showCropUI && recordedAudio && (
                    <div className="fl-panel p-5 mt-6 w-full">
                      <div className="font-semibold text-[#eceee8] mb-1">Trim loop</div>
                      <div className="text-xs mb-3 text-[#929e92]">Drag the handles to trim, drag the middle to move the selection.</div>

                      <div className="rounded p-3 bg-[#191c19] border border-[#343a35]">
                        <canvas id="waveform-canvas" width="800" height="140" className="w-full h-[140px] rounded bg-transparent cursor-pointer select-none touch-none" />
                      </div>

                      <div className="flex flex-wrap items-center gap-3 mt-4">
                        <button onClick={cropAudio} disabled={isCropping || isRecording} className="fl-btn-primary h-10 px-5 text-sm">
                          {isCropping ? 'Trimming…' : 'Apply trim'}
                        </button>
                        <button onClick={undoTrim} disabled={undoStack.length === 0 || isCropping || isRecording} className="fl-btn h-10 px-5 text-sm">
                          ↺ Undo
                        </button>
                        <div className="text-sm text-[#b1b9af] ml-auto">Duration: {audioDuration.toFixed(2)}s</div>
                      </div>
                    </div>
                  )}

                  {savedLoops && savedLoops.length > 0 && (
                    <div className="mt-8">
                      <div className="font-semibold text-[#eceee8] mb-3">Saved loops</div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {savedLoops.map(loop => (
                          <div key={loop.id} className="fl-card p-3.5 flex flex-wrap items-center justify-between gap-3">
                            <div className="min-w-0">
                              <div className="font-bold text-sm text-[#eceee8] truncate">{loop.name || 'Untitled loop'}</div>
                              <div className="text-xs text-[#b1b9af] mt-0.5">
                                {loop.progressionName ? `${loop.progressionName} • ` : ''}Key {loop.key} • {loop.bpm} BPM
                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button onClick={() => loadLoop(loop.id)} className="fl-btn h-9 px-3.5 text-[13px]">Load</button>
                              <button onClick={() => deleteLoop(loop.id)} className="fl-btn-danger h-9 px-3.5 text-[13px]">Delete</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ---------------- About ---------------- */}
              {page === 'About' && (
                <div className="page">
                  <div className="page-heading"><div><div className="eyebrow">FretLab</div><h1>A workspace for your practice.</h1></div></div>
                  <div className="about-copy space-y-4">
                    <p>
                      FretLab is a free, browser-based practice studio for guitarists. Visualize any scale or
                      diatonic chord across the full neck, tune up with the chromatic tuner, and record
                      quantized practice loops in Jam Mode — no installs, no accounts.
                    </p>
                    <p className="text-[#eceee8] font-semibold">Built by Nathan Kwon.</p>
                  </div>
                </div>
              )}
              </main>
            </div>
          </div>
        );
      };

      window.GuitarScaleExplorer = GuitarScaleExplorer;
    </script>

    <script type="text/babel">
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }
        componentDidCatch(error, info) {
          console.error('Render error:', error, info);
        }
        render() {
          if (this.state.hasError) {
            return (
              <div className="min-h-screen flex items-center justify-center p-6">
                <div className="fl-panel max-w-lg w-full p-6">
                  <h2 className="text-lg font-semibold text-[#ffb6a8] mb-2">Something went wrong</h2>
                  <p className="text-sm text-[#ffb6a8]">{String(this.state.error)}</p>
                  <button
                    className="fl-btn-primary mt-4 px-4 py-2"
                    onClick={() => window.location.reload()}
                  >
                    Reload
                  </button>
                </div>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function mountApp() {
        try {
          if (!window.GuitarScaleExplorer) {
            throw new Error('Component not loaded yet.');
          }
          const container = document.getElementById('root');
          if (!container) {
            throw new Error('Root container not found.');
          }
          const root = ReactDOM.createRoot(container);
          root.render(
            <ErrorBoundary>
              <GuitarScaleExplorer />
            </ErrorBoundary>
          );
        } catch (e) {
          console.error(e);
          const container = document.getElementById('root');
          if (container) {
            container.innerHTML = `
              <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#171918;padding:24px;">
                <div style="max-width:640px;width:100%;background:#202321;border:1px solid #454d46;border-radius:6px;padding:16px;font-family:ui-sans-serif,system-ui;">
                  <div style="font-weight:600;color:#ffb6a8;margin-bottom:8px;">Failed to load the app</div>
                  <div style="color:#b1b9af;font-size:14px;">${String(e)}</div>
                </div>
              </div>`;
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', mountApp);
      } else {
        mountApp();
      }
    </script>
  </body>
  </html>
