<html lang="en">

    <title>FretLab — Guitar Scale & Chord Explorer</title>
    <meta name="description" content="FretLab is an interactive guitar practice studio: explore scales and diatonic chords on a full 21-fret fretboard, tune up with the built-in chromatic tuner, and record quantized loops in Jam Mode." />

    <style>
      :root {
        --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji';
        --bg: #151210; --panel: #1d1915; --panel2: #26211b;
        --border: #332b22; --border2: #453a2d;
        --text: #efe7da; --muted: #a89a86; --faint: #6e6353;
        --amber: #f59e0b; --amber2: #fbbf24; --cream: #f5e9d0;
      }
      html, body { font-family: var(--font-sans); background: var(--bg); color: var(--text); }
      body {
        background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245, 158, 11, .06), transparent);
        background-attachment: fixed;
      }

      /* Amp-room design system */
      .fl-panel {
        background: linear-gradient(180deg, var(--panel2), var(--panel));
        border: 1px solid var(--border2); border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
      }
      .fl-card { background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; box-shadow: 0 3px 10px rgba(0, 0, 0, .3); }
      .fl-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--faint); font-weight: 700; }
      .fl-input { background: #141110; border: 1px solid var(--border2); color: var(--text); border-radius: 8px; outline: none; }
      .fl-input:focus { border-color: var(--amber); }
      .fl-btn { background: #141110; border: 1px solid var(--border2); color: var(--muted); border-radius: 8px; font-weight: 600; cursor: pointer; transition: color .15s, border-color .15s; }
      .fl-btn:hover:not(:disabled) { color: var(--text); border-color: #5a4c39; }
      .fl-btn:disabled { opacity: .45; cursor: not-allowed; }
      .fl-btn-primary { background: linear-gradient(180deg, #fbbf24, #d97706); color: #2b1a05; border: 1px solid #b45309; border-radius: 8px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 10px rgba(245, 158, 11, .3); }
      .fl-btn-primary:hover:not(:disabled) { filter: brightness(1.07); }
      .fl-btn-primary:disabled { opacity: .5; cursor: not-allowed; }
      .fl-btn-danger { background: linear-gradient(180deg, #f87356, #c2410c); color: #fff7ed; border: 1px solid #9a3412; border-radius: 8px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 10px rgba(194, 65, 12, .35); }
      .fl-btn-danger:hover:not(:disabled) { filter: brightness(1.07); }
      .fl-switch { display: inline-flex; border: 1px solid var(--border2); border-radius: 20px; overflow: hidden; background: #141110; }
      .fl-switch button { border: none; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; font-family: inherit; }
      .fl-switch button.on { background: var(--amber); color: #2b1a05; }

      .rail-btn { color: var(--faint); border-radius: 10px; position: relative; transition: color .15s, background .15s; }
      .rail-btn:hover { background: #1d1813; color: var(--muted); }
      .rail-btn.active { background: #241d14; color: var(--amber2); }
      .rail-btn.active::before { content: ''; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--amber); box-shadow: 0 0 8px rgba(245, 158, 11, .6); }
      .brand-mark { background: radial-gradient(circle at 35% 30%, #fbbf24, #b45309); box-shadow: inset 0 -2px 5px rgba(0, 0, 0, .4), 0 0 14px rgba(245, 158, 11, .35); }
      .led { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px rgba(74, 222, 128, .7); }
      .led.rec { background: #f87171; box-shadow: 0 0 8px rgba(248, 113, 113, .8); }

      .wood { background: linear-gradient(180deg, #43301f 0%, #38271a 30%, #2e2015 70%, #271b12 100%); box-shadow: inset 0 2px 8px rgba(0, 0, 0, .5); }
      .fret-wire { background: linear-gradient(90deg, #c9a45e, #7d6236); box-shadow: 1px 0 2px rgba(0, 0, 0, .5); }
      .string-metal { background: linear-gradient(180deg, #e8dcc0, #8f8468); box-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
      .inlay-pearl { background: radial-gradient(circle at 35% 30%, #fdf6e3, #b9ab8d); opacity: .5; }
      .note-root-glow { box-shadow: 0 0 12px rgba(245, 158, 11, .55), 0 2px 6px rgba(0, 0, 0, .5) !important; }

      .knob { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a3f31, #241d15); border: 1px solid var(--border2); box-shadow: inset 0 2px 4px rgba(255, 255, 255, .06), 0 3px 8px rgba(0, 0, 0, .5); position: relative; }
      .knob-needle { position: absolute; top: 4px; left: 50%; width: 3px; height: 12px; background: var(--amber2); border-radius: 2px; transform-origin: 50% 18px; box-shadow: 0 0 5px rgba(251, 191, 36, .7); }

      .screw { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7a6c56, #3a3128); }

    <script type="text/babel" data-presets="env,react">
      const { useState, useMemo } = React;

      // ---- Static music data ----
      const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

      const strings = [
        { name: 'e', openNote: 4 },
        { name: 'B', openNote: 11 },
        { name: 'G', openNote: 7 },
        { name: 'D', openNote: 2 },
        { name: 'A', openNote: 9 },
        { name: 'E', openNote: 4 }
      ];

      const scales = {
        major: [0, 2, 4, 5, 7, 9, 11],
        minor: [0, 2, 3, 5, 7, 8, 10],
        pentatonicMajor: [0, 2, 4, 7, 9],
        pentatonicMinor: [0, 3, 5, 7, 10],
        blues: [0, 3, 5, 6, 7, 10],
        dorian: [0, 2, 3, 5, 7, 9, 10],
        phrygian: [0, 1, 3, 5, 7, 8, 10],
        lydian: [0, 2, 4, 6, 7, 9, 11],
        mixolydian: [0, 2, 4, 5, 7, 9, 10],
        locrian: [0, 1, 3, 5, 6, 8, 10],
        harmonicMinor: [0, 2, 3, 5, 7, 8, 11],
        melodicMinor: [0, 2, 3, 5, 7, 9, 11]
      };

      const scaleNames = {
        major: 'Major',
        minor: 'Natural Minor',
        pentatonicMajor: 'Pentatonic Major',
        pentatonicMinor: 'Pentatonic Minor',
        blues: 'Blues',
        dorian: 'Dorian',
        phrygian: 'Phrygian',
        lydian: 'Lydian',
        mixolydian: 'Mixolydian',
        locrian: 'Locrian',
        harmonicMinor: 'Harmonic Minor',
        melodicMinor: 'Melodic Minor'
      };

      const tuningPresets = {
        standard: ['E', 'A', 'D', 'G', 'B', 'E'],
        dropD: ['D', 'A', 'D', 'G', 'B', 'E'],
        halfStepDown: ['D#', 'G#', 'C#', 'F#', 'A#', 'D#'],
      };

      const chordProgressions = [
        { name: 'I-V-vi-IV', romans: ['I', 'V', 'vi', 'IV'] },
        { name: 'I-vi-IV-V', romans: ['I', 'vi', 'IV', 'V'] },
        { name: 'vi-IV-I-V', romans: ['vi', 'IV', 'I', 'V'] },
        { name: 'I-V-IV-I', romans: ['I', 'V', 'IV', 'I'] },
        { name: 'ii-V-I', romans: ['ii', 'V', 'I'] },
        { name: 'Custom', romans: [] },
      ];

      const RailIcon = ({ children }) => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
      );
      const IconHome = () => <RailIcon><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></RailIcon>;
      const IconFret = () => <RailIcon><path d="M3 6h18M3 12h18M3 18h18M8 3v18M16 3v18" /></RailIcon>;
      const IconTuner = () => <RailIcon><path d="M12 3v10M12 13a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM8 5l4-2 4 2" /></RailIcon>;
      const IconJam = () => <RailIcon><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" /></RailIcon>;
      const IconInfo = () => <RailIcon><circle cx="12" cy="12" r="9" /><path d="M12 8h.01M12 12v4" /></RailIcon>;

      const Knob = ({ value, min, max }) => {
        const clamped = Math.max(min, Math.min(max, value));
        const angle = -135 + ((clamped - min) / (max - min)) * 270;
        return (
          <div className="knob" style={{ width: 44, height: 44 }}>
            <div className="knob-needle" style={{ transform: `translateX(-50%) rotate(${angle}deg)` }} />
          </div>
        );
      };

      const isLightColor = (hex) => {
        if (!hex || hex[0] !== '#' || hex.length < 7) return false;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return 0.299 * r + 0.587 * g + 0.114 * b > 150;
      };

      const romanForChord = (chord) => {
        const base = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][chord.degree - 1] || '';
        const q = chord.quality || '';
        const minorish = q === 'm' || q === 'm7' || q === 'dim' || q === 'dim7' || q === 'm7b5';
        let roman = minorish ? base.toLowerCase() : base;
        if (q === 'dim' || q === 'dim7') roman += '°';
        if (q === 'm7b5') roman += 'ø';
        return roman;
      };

      const GuitarScaleExplorer = () => {
        const [rootNote, setRootNote] = useState('C');
        const [scaleType, setScaleType] = useState('major');
        const [showDegrees, setShowDegrees] = useState(false);
        const [hoveredNote, setHoveredNote] = useState(null);
        const [rootColor, setRootColor] = useState('#f59e0b');
        const [noteColor, setNoteColor] = useState('#f5e9d0');
        const [thirdColor, setThirdColor] = useState('#d96d2f');
        const [chordType, setChordType] = useState('triads');
        const [selectedChord, setSelectedChord] = useState(null);
        const [startFret, setStartFret] = useState(1);
        const [endFret, setEndFret] = useState(21);
        const [drawingMode, setDrawingMode] = useState(null);
        const [drawings, setDrawings] = useState({});
        const [savedDrawings, setSavedDrawings] = useState([]);
        const [page, setPage] = useState('Home');

        const [bpm, setBpm] = useState(100);
        const [isMetronomeOn, setIsMetronomeOn] = useState(false);
        const [isMetronomeEnabled, setIsMetronomeEnabled] = useState(true);
        const metroRef = React.useRef({ audioCtx: null, intervalId: null });
        const click = () => {
          try {
            const ctx = metroRef.current.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            metroRef.current.audioCtx = ctx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            gain.gain.setValueAtTime(0.001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.001);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.connect(gain).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
          } catch (e) {}
        };
        const startMetronome = () => {
          if (isMetronomeOn) return;
          const ms = Math.max(60_000 / Math.max(20, Math.min(300, bpm)), 50);
          click();
          metroRef.current.intervalId = setInterval(click, ms);
          setIsMetronomeOn(true);
        };
        const stopMetronome = () => {
          if (metroRef.current.intervalId) clearInterval(metroRef.current.intervalId);
          metroRef.current.intervalId = null;
          setIsMetronomeOn(false);
        };
        React.useEffect(() => {
          if (!isMetronomeOn) return;
          if (metroRef.current.intervalId) {
            clearInterval(metroRef.current.intervalId);
            metroRef.current.intervalId = null;
          }
          const ms = Math.max(60_000 / Math.max(20, Math.min(300, bpm)), 50);
          metroRef.current.intervalId = setInterval(click, ms);
          return () => {
            if (metroRef.current.intervalId) clearInterval(metroRef.current.intervalId);
          };
        }, [bpm, isMetronomeOn]);

        const [isTunerOn, setIsTunerOn] = useState(false);
        const [tunerFreq, setTunerFreq] = useState(0);
        const [tunerNote, setTunerNote] = useState('-');
        const [tunerCents, setTunerCents] = useState(0);
        const [tunerError, setTunerError] = useState(null);
        const tunerSmoothRef = React.useRef({
          freqSamples: [],
          centsSamples: [],
          sliderCents: 0,
          lastGoodTs: 0,
          lastNote: '-',
        });
        const MAX_TUNER_HISTORY = 12;
        const MIN_TUNER_SIGNAL_RMS = 0.012;
        const TUNER_SIGNAL_HANG_MS = 400;
        const TUNER_NEEDLE_SMOOTHING = 0.18;
        const tunerRef = React.useRef({
          audioCtx: null,
          analyser: null,
          source: null,
          stream: null,
          rafId: null,
          buf: null,
        });

        const [tuning, setTuning] = useState('standard');
        const [selectedString, setSelectedString] = useState(0);
        const [stringHoldStart, setStringHoldStart] = useState(null);
        const [stringConfirmed, setStringConfirmed] = useState(false);
        const [autoDetectString, setAutoDetectString] = useState(true);

        const [isRecording, setIsRecording] = useState(false);
        const [recordedAudio, setRecordedAudio] = useState(null);
        const [isPlaying, setIsPlaying] = useState(false);
        const [isLooping, setIsLooping] = useState(false);
        const [selectedProgression, setSelectedProgression] = useState(null);
        const [audioDuration, setAudioDuration] = useState(0);
        const [cropStart, setCropStart] = useState(0);
        const [cropEnd, setCropEnd] = useState(0);
        const [isCropping, setIsCropping] = useState(false);
        const [originalAudio, setOriginalAudio] = useState(null);
        const [undoStack, setUndoStack] = useState([]);
        const [selectedKey, setSelectedKey] = useState('C');
        const [countdown, setCountdown] = useState(null);
        const [isCountdownActive, setIsCountdownActive] = useState(false);
        const [showCropUI, setShowCropUI] = useState(false);
        const [savedLoops, setSavedLoops] = useState([]);
        const [playbackTime, setPlaybackTime] = useState(0);
        const [isLoopProcessing, setIsLoopProcessing] = useState(false);
        const [loopQuantizeInfo, setLoopQuantizeInfo] = useState(null);
        const idbRef = React.useRef({ db: null });
        const jamModeRef = React.useRef({
          mediaRecorder: null,
          audioChunks: [],
          audioContext: null,
          audioBuffer: null,
          sourceNode: null,
          loopTimeout: null,
          shouldLoop: false,
          audioElement: null,
          countdownInterval: null,
          metronomeStartedByRecording: false,
          countdownTimeouts: [],
        });
        const LOOP_GRID_SUBDIVISIONS = 4;
        const LOOP_CROSSFADE_TIME = 0.02;

        const waveformRef = React.useRef({
          canvas: null,
          ctx: null,
          dragging: null,
          dragOffset: 0,
          pixelsPerSecond: 100,
          currentCropStart: null,
          currentCropEnd: null,
        });
        const cropBoundsRef = React.useRef({
          start: 0,
          end: 0,
          duration: 0,
        });
        const playbackRef = React.useRef({
          isPlaying: false,
          time: 0,
        });

        React.useEffect(() => {
          cropBoundsRef.current.start = cropStart;
        }, [cropStart]);

        React.useEffect(() => {
          cropBoundsRef.current.end = cropEnd;
        }, [cropEnd]);

        React.useEffect(() => {
          cropBoundsRef.current.duration = audioDuration || 0;
        }, [audioDuration]);

        React.useEffect(() => {
          playbackRef.current.isPlaying = isPlaying;
        }, [isPlaying]);

        React.useEffect(() => {
          playbackRef.current.time = playbackTime;
        }, [playbackTime]);

        const scaleNotesMajor = (root) => {
          const idx = noteNames.indexOf(root);
          if (idx < 0) return [];
          return scales.major.map(semi => noteNames[(idx + semi) % noteNames.length]);
        };

        const romanToChordInKey = (key, roman) => {
          const scale = scaleNotesMajor(key);
          if (!scale.length) return '';
          const map = { 'I':0,'ii':1,'II':1,'iii':2,'III':2,'IV':3,'iv':3,'V':4,'v':4,'vi':5,'VI':5,'vii':6,'VII':6 };
          const deg = map[roman.replace('°','')] ?? 0;
          const note = scale[deg];
          const isDim = roman.includes('vii') || roman.includes('°');
          const isMinor = roman === roman.toLowerCase() && !isDim;
          if (isDim) return note + 'dim';
          if (isMinor) return note + 'm';
          return note;
        };

        const chordsForProgression = (key, romans) => romans.map(r => romanToChordInKey(key, r));

        const playCountdownClick = () => {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.001);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.connect(gain).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
          } catch (e) {}
        };

        const analyzeLoopEnvelope = (buffer) => {
          if (!buffer) return { start: 0, end: buffer ? buffer.duration : 0 };
          const sampleRate = buffer.sampleRate;
          const channelData = buffer.getChannelData(0);
          const windowSize = Math.max(1, Math.floor(sampleRate * 0.005));
          let maxAvg = 0;
          for (let i = 0; i < channelData.length; i += windowSize) {
            let sum = 0;
            for (let j = 0; j < windowSize && i + j < channelData.length; j++) {
              sum += Math.abs(channelData[i + j]);
            }
            const avg = sum / windowSize;
            if (avg > maxAvg) maxAvg = avg;
          }
          const threshold = Math.max(0.01, maxAvg * 0.3);
          let startSample = 0;
          for (let i = 0; i < channelData.length; i++) {
            if (Math.abs(channelData[i]) >= threshold) {
              startSample = Math.max(0, i - windowSize * 4);
              break;
            }
          }
          let endSample = channelData.length - 1;
          for (let i = channelData.length - 1; i >= 0; i--) {
            if (Math.abs(channelData[i]) >= threshold) {
              endSample = Math.min(channelData.length - 1, i + windowSize * 4);
              break;
            }
          }
          if (endSample <= startSample) {
            endSample = Math.min(channelData.length - 1, startSample + windowSize * 40);
          }
          return {
            start: startSample / sampleRate,
            end: Math.min(buffer.duration, (endSample + 1) / sampleRate),
          };
        };

        const quantizeWindowToGrid = (window, bpmValue, bufferDuration) => {
          const safeBpm = Math.max(20, Math.min(300, bpmValue));
          const beatSeconds = 60 / safeBpm;
          const grid = beatSeconds / LOOP_GRID_SUBDIVISIONS;
          const quantize = (time) => Math.round(time / grid) * grid;
          let start = Math.max(0, Math.min(bufferDuration - grid, quantize(window.start)));
          let end = Math.min(bufferDuration, Math.max(start + grid, quantize(window.end)));
          const beats = Math.max(1, Math.round((end - start) / beatSeconds));
          end = Math.min(bufferDuration, start + beats * beatSeconds);
          return { start, end, beats, beatSeconds };
        };

        const sliceAudioBuffer = (ctx, buffer, startSec, endSec) => {
          const sampleRate = buffer.sampleRate;
          const startSample = Math.max(0, Math.floor(startSec * sampleRate));
          const endSample = Math.min(buffer.length, Math.floor(endSec * sampleRate));
          const length = Math.max(1, endSample - startSample);
          const sliced = ctx.createBuffer(buffer.numberOfChannels, length, sampleRate);
          for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const source = buffer.getChannelData(channel);
            const target = sliced.getChannelData(channel);
            for (let i = 0; i < length; i++) {
              target[i] = source[startSample + i] || 0;
            }
          }
          return sliced;
        };

        const applyCrossfadeToBuffer = (buffer, seconds = LOOP_CROSSFADE_TIME) => {
          const fadeSamples = Math.min(
            Math.floor(seconds * buffer.sampleRate),
            Math.floor(buffer.length / 2)
          );
          if (fadeSamples <= 1) return;
          for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const data = buffer.getChannelData(channel);
            for (let i = 0; i < fadeSamples; i++) {
              const fadeIn = i / fadeSamples;
              data[i] *= fadeIn;
              const fadeOutIndex = buffer.length - fadeSamples + i;
              const fadeOut = 1 - i / fadeSamples;
              if (fadeOutIndex >= 0 && fadeOutIndex < buffer.length) {
                data[fadeOutIndex] *= fadeOut;
              }
            }
          }
        };

        const quantizeAndSmoothLoop = async (blob, bpmValue) => {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          try {
            const arrayBuffer = await blob.arrayBuffer();
            const decoded = await audioCtx.decodeAudioData(arrayBuffer);
            const envelopeWindow = analyzeLoopEnvelope(decoded);
            const quantized = quantizeWindowToGrid(envelopeWindow, bpmValue, decoded.duration);
            const sliced = sliceAudioBuffer(audioCtx, decoded, quantized.start, quantized.end);
            applyCrossfadeToBuffer(sliced);
            const wavBuffer = audioBufferToWav(sliced);
            const processedBlob = new Blob([wavBuffer], { type: 'audio/wav' });
            return {
              blob: processedBlob,
              buffer: sliced,
              duration: sliced.duration,
              quantized,
            };
          } finally {
            audioCtx.close().catch(() => {});
          }
        };

        const processLoopRecording = async (rawBlob) => {

            jamModeRef.current.audioChunks = audioChunks;

        const cropAudio = async () => {
          if (!recordedAudio || audioDuration === 0) return;
          
          const startTime = Math.max(0, Math.min(cropStart, audioDuration - 0.1));

          if (endTime <= startTime) {

            return;

          setIsCropping(true);
          try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audioUrl = URL.createObjectURL(recordedAudio);
            const response = await fetch(audioUrl);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            const sampleRate = audioBuffer.sampleRate;
            const startSample = Math.floor(startTime * sampleRate);
            const endSample = Math.floor(endTime * sampleRate);
            const length = endSample - startSample;

            const croppedBuffer = audioContext.createBuffer(
              audioBuffer.numberOfChannels,
              length,
              sampleRate
            );
            
            for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
              const oldData = audioBuffer.getChannelData(channel);
              const newData = croppedBuffer.getChannelData(channel);

          const getSecFromX = (clientX) => {
            const rect = canvas.getBoundingClientRect();
            const relX = Math.max(0, Math.min(rect.width, clientX - rect.left));
            const duration = Math.max(0.0001, cropBoundsRef.current.duration || audioDuration || 1);
            const sec = (relX / rect.width) * duration;
            return Math.max(0, Math.min(duration, sec));
          };
          
          const onDown = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left;
            const width = rect.width;
            const duration = Math.max(0.0001, cropBoundsRef.current.duration || audioDuration || 1);
            const currentStart = waveformRef.current.currentCropStart ?? cropBoundsRef.current.start;
            const currentEnd = waveformRef.current.currentCropEnd ?? (cropBoundsRef.current.end ?? duration);
            const startX = (currentStart / duration) * width;
            const endX = (currentEnd / duration) * width;
            const handleHitWidth = 30;

            const distToStart = Math.abs(x - startX);
            const distToEnd = Math.abs(x - endX);
            const isNearStart = distToStart < handleHitWidth;
            const isNearEnd = distToEnd < handleHitWidth;
            const isInSelection = x >= startX && x <= endX && !isNearStart && !isNearEnd;
            
            if (isNearStart && distToStart <= distToEnd) {
              waveformRef.current.dragging = 'start';
              waveformRef.current.dragStartX = x;
            } else if (isNearEnd) {
              waveformRef.current.dragging = 'end';
              waveformRef.current.dragStartX = x;
            } else if (isInSelection) {
              waveformRef.current.dragging = 'move';
              waveformRef.current.dragStartX = x;
              waveformRef.current.dragOffset = x - startX;
            } else {
              const clickSec = getSecFromX(clientX);
              if (x < startX) {
                waveformRef.current.dragging = 'start';
                waveformRef.current.dragStartX = x;
                const newStart = Math.max(0, Math.min(clickSec, currentEnd - 0.05));
                setCropStart(newStart);
                waveformRef.current.currentCropStart = newStart;
              } else {
                waveformRef.current.dragging = 'end';
                waveformRef.current.dragStartX = x;
                const newEnd = Math.min(duration, Math.max(clickSec, currentStart + 0.05));
                setCropEnd(newEnd);
                waveformRef.current.currentCropEnd = newEnd;
              }
            }
            down = true;
            canvas.setPointerCapture?.(e.pointerId || 0);
          };
          
          const onMove = (e) => {
            if (!down || !waveformRef.current.dragging) return;
            e.preventDefault();
            e.stopPropagation();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left;
            const width = rect.width;
            const sec = getSecFromX(clientX);
            const duration = Math.max(0.0001, cropBoundsRef.current.duration || audioDuration || 1);
            const currentStart = waveformRef.current.currentCropStart ?? cropBoundsRef.current.start;
            const currentEnd = waveformRef.current.currentCropEnd ?? cropBoundsRef.current.end;
            
            if (waveformRef.current.dragging === 'start') {
              const endLimit = currentEnd ?? duration;
              const newStart = Math.max(0, Math.min(sec, endLimit - 0.05));
              waveformRef.current.currentCropStart = newStart;
              setCropStart(newStart);
            } else if (waveformRef.current.dragging === 'end') {
              const startLimit = currentStart ?? 0;
              const newEnd = Math.min(duration, Math.max(sec, startLimit + 0.05));
              waveformRef.current.currentCropEnd = newEnd;
              setCropEnd(newEnd);
            } else if (waveformRef.current.dragging === 'move') {
              const selectionWidth = Math.max(0.05, (currentEnd ?? duration) - (currentStart ?? 0));
              const offsetInSec = (waveformRef.current.dragOffset / width) * duration;
              const newStart = Math.max(0, Math.min(sec - offsetInSec, duration - selectionWidth));
              const newEnd = Math.min(duration, newStart + selectionWidth);
              waveformRef.current.currentCropStart = newStart;
              waveformRef.current.currentCropEnd = newEnd;
              setCropStart(newStart);
              setCropEnd(newEnd);
            }

            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
              drawWaveformLocal();
              rafId = null;
            });
          };
          const onUp = (e) => {
            down = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
            canvas.releasePointerCapture?.(e.pointerId || 0);
            waveformRef.current.dragging = null;
            waveformRef.current.dragStartX = null;
            waveformRef.current.dragOffset = null;
            waveformRef.current.currentCropStart = null;
            waveformRef.current.currentCropEnd = null;
            drawWaveformLocal();
          };

          canvas.style.userSelect = 'none';
          canvas.style.touchAction = 'none';
          canvas.style.cursor = 'pointer';
          
          (async () => {
            await ensureWaveformBuffer();
            waveformRef.current.currentCropStart = cropStart;
            waveformRef.current.currentCropEnd = cropEnd;
            drawWaveformLocal();
          })();

          const onHover = (e) => {
            if (!canvas || down) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const width = rect.width;
            const duration = Math.max(0.0001, cropBoundsRef.current.duration || audioDuration || 1);
            const currentStart = waveformRef.current.currentCropStart ?? cropBoundsRef.current.start;
            const currentEnd = waveformRef.current.currentCropEnd ?? (cropBoundsRef.current.end ?? duration);
            const startX = (currentStart / duration) * width;
            const endX = (currentEnd / duration) * width;
            const handleHitWidth = 25;
            
            const distToStart = Math.abs(x - startX);
            const distToEnd = Math.abs(x - endX);
            
            if (distToStart < handleHitWidth || distToEnd < handleHitWidth) {
              canvas.style.cursor = 'ew-resize';
            } else if (x >= startX && x <= endX) {

            } else {

          const pointerMoveHandler = (e) => {
            if (!down) {
              onHover(e);
            } else {
              onMove(e);
            }
          };

          const mouseMoveHandler = (e) => {
            if (!down) {
              onHover(e);
            } else {
              onMove(e);
            }
          };

          canvas.addEventListener('pointermove', pointerMoveHandler);
          window.addEventListener('pointerup', onUp);
          window.addEventListener('pointercancel', onUp);
          canvas.addEventListener('mousedown', onDown);
          canvas.addEventListener('mousemove', mouseMoveHandler);
          window.addEventListener('mouseup', onUp);
          canvas.addEventListener('touchstart', onDown, { passive: false });
          canvas.addEventListener('touchmove', onMove, { passive: false });
          window.addEventListener('touchend', onUp);
          window.addEventListener('touchcancel', onUp);
          return () => {
            if (canvas) canvas.style.cursor = 'default';
            if (rafId) cancelAnimationFrame(rafId);
            window.removeEventListener('resize', onResize);
            canvas.removeEventListener('pointerdown', onDown);
            canvas.removeEventListener('pointermove', pointerMoveHandler);
            window.removeEventListener('pointerup', onUp);
            window.removeEventListener('pointercancel', onUp);
            canvas.removeEventListener('mousedown', onDown);
            canvas.removeEventListener('mousemove', mouseMoveHandler);
            window.removeEventListener('mouseup', onUp);
            canvas.removeEventListener('touchstart', onDown);
            canvas.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onUp);
            window.removeEventListener('touchcancel', onUp);

        }, [showCropUI, recordedAudio, audioDuration, bpm]);

        React.useEffect(() => {
          if (showCropUI && jamModeRef.current.audioBuffer) {
            if (!waveformRef.current.dragging) {
              waveformRef.current.currentCropStart = cropStart;
              waveformRef.current.currentCropEnd = cropEnd;
            }

          }
        }, [showCropUI, cropStart, cropEnd, audioDuration, playbackTime, bpm]);

        React.useEffect(() => {
          if (!isPlaying || !showCropUI) return;
          let rafId = null;
          const animate = () => {
            drawWaveform();
            rafId = requestAnimationFrame(animate);
          };
          rafId = requestAnimationFrame(animate);
          return () => {
            if (rafId) cancelAnimationFrame(rafId);
          };
        }, [isPlaying, showCropUI]);

        const audioBufferToWav = (buffer) => {
          const length = buffer.length * buffer.numberOfChannels * 2 + 44;
          const arrayBuffer = new ArrayBuffer(length);
          const view = new DataView(arrayBuffer);
          const channels = [];
          let offset = 0;
          let pos = 0;

          const setUint16 = (data) => {
            view.setUint16(pos, data, true);
            pos += 2;
          };
          const setUint32 = (data) => {
            view.setUint32(pos, data, true);
            pos += 4;
          };

          setUint32(0x46464952);
          setUint32(length - 8);
          setUint32(0x45564157);
          setUint32(0x20746d66);
          setUint32(16);
          setUint16(1);
          setUint16(buffer.numberOfChannels);
          setUint32(buffer.sampleRate);
          setUint32(buffer.sampleRate * 2 * buffer.numberOfChannels);
          setUint16(buffer.numberOfChannels * 2);
          setUint16(16);
          setUint32(0x61746164);
          setUint32(length - pos - 4);

          for (let i = 0; i < buffer.numberOfChannels; i++) {
            channels.push(buffer.getChannelData(i));
          }
          while (pos < length) {
            for (let i = 0; i < buffer.length; i++) {
              for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                let sample = Math.max(-1, Math.min(1, channels[channel][i]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(pos, sample, true);
                pos += 2;
              }
            }
          }

          return arrayBuffer;
        };

        React.useEffect(() => {
          return () => {

            }
            if (jamModeRef.current.mediaRecorder && jamModeRef.current.mediaRecorder.state !== 'inactive') {
              jamModeRef.current.mediaRecorder.stop();
            }
          };
        }, []);

        const noteNameToMidi = (name, octave) => {
          const idx = noteNames.indexOf(name);
          if (idx < 0) return null;
          return (octave + 1) * 12 + idx;
        };
        const midiToFreq = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
        const buildTargetFreqs = (presetKey) => {
          const baseOctavesStandard = [2,2,3,3,3,4];
          const names = tuningPresets[presetKey];
          if (!names) return [];
          const octaves = [...baseOctavesStandard];
          return names.map((n, i) => {
            const midi = noteNameToMidi(n, octaves[i]);
