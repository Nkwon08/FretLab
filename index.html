    <style>
      :root {
        color-scheme: dark;
        --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        --bg: #171918; --panel: #202321; --panel2: #252925;
        --border: #343a35; --border2: #454d46;
        --text: #eceee8; --muted: #b1b9af; --faint: #929e92;
        --amber: #d6b577; --amber2: #e0c48e; --cream: #eceee8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
      button, input, select { font: inherit; }

      :focus-visible { outline: 2px solid var(--amber2); outline-offset: 4px; }

      .fl-input:focus { border-color: var(--amber); }

      .fl-btn { background: transparent; border: 1px solid var(--border2); color: var(--text); }
      .fl-btn:hover:not(:disabled) { background: #303630; border-color: #798879; }
      .fl-btn-primary { background: var(--amber); color: #252116; border: 1px solid var(--amber); }
      .fl-btn-primary:hover:not(:disabled) { background: var(--amber2); border-color: var(--amber2); }
      .fl-btn-danger { background: #432b2a; color: #ffb6a8; border: 1px solid #89584f; }

      .app-nav { position: fixed; inset: 0 auto 0 0; width: 184px; padding: 24px 12px 16px; background: #121513; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; z-index: 40; }
      .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 30px; font-size: 19px; font-weight: 600; letter-spacing: -.04em; }
      .brand-mark { width: 28px; height: 30px; color: var(--amber); display: grid; place-items: center; border-left: 3px solid var(--amber); border-right: 1px solid #6b624e; }
      .nav-section { padding: 0 12px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); }
      .rail-btn { display: flex; align-items: center; gap: 12px; padding: 12px; width: 100%; color: var(--muted); border-radius: 4px; text-align: left; font-size: 13px; transition: color .15s, background .15s; }
      .rail-btn svg { width: 18px; height: 18px; flex: none; stroke-width: 1.6; }
      .rail-btn:hover { background: #252c26; color: var(--text); }
      .rail-btn.active { background: #2c332b; color: #e0c48e; box-shadow: inset 2px 0 var(--amber); }
      .nav-spacer { flex: 1; }
      .nav-foot { margin: 16px 12px 0; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); }
      .app-shell { margin-left: 184px; min-width: 0; }
      .app-header { min-height: 64px; padding: 16px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
      .header-context { color: var(--muted); font-size: 12px; }
      .status { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
      .led { width: 6px; height: 6px; border-radius: 50%; background: #a5bb95; flex-shrink: 0; }

      .display-options-content { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 12px 0; }

      .wood { background: #262d27; border-radius: 4px; }
      .fret-wire { background: #697568; width: 1px; }
      .string-metal { background: #83907e; opacity: .65; }
      .inlay-pearl { background: #a8b39f; opacity: .25; }
      .note-root-glow { box-shadow: 0 0 0 2px #262d27, 0 0 0 3px var(--amber) !important; }
      .fret-position { border: 0; padding: 0; background: transparent; color: inherit; }
      .fret-position:focus-visible { outline-offset: -3px; z-index: 25; }
      
      .fret-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 11px; margin: 8px 0 24px; }
      .legend-item { display: inline-flex; align-items: center; gap: 6px; }
      .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
      .chord-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
      .chord-option { text-align: left; padding: 12px; min-width: 0; }
      .chord-option:hover { background: #2d342c; border-color: #798879; }
      .chord-option[aria-pressed=true] { border-color: var(--amber); background: #303329; }
      .saved-section { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }
      .saved-pattern { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
      .saved-pattern > button:first-child { text-align: left; min-width: 0; flex: 1; padding: 12px 0; }
      .knob { border-radius: 50%; background: #30372e; border: 1px solid #64715e; position: relative; }
      .knob-needle { position: absolute; top: 4px; left: 50%; width: 2px; height: 12px; background: var(--amber2); transform-origin: 50% 18px; }
      .tuner-workspace { padding: 28px; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(230px, 1fr); gap: 32px; }
      .tuner-settings { border-left: 1px solid var(--border); padding-left: 28px; }
      .string-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
      .string-key { padding: 12px 6px; border: 1px solid var(--border2); border-radius: 4px; text-align: center; }
      .string-key[aria-pressed=true] { border-color: var(--amber); background: #383a2c; }
      .string-key:hover { background: #30372e; }
      .string-key small { display: block; color: var(--muted); font-size: 10px; margin-bottom: 4px; }
      .string-key strong { font-size: 21px; font-weight: 500; }
      .jam-settings { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
      .jam-settings > section { padding: 24px; }
      .jam-settings > section + section { border-left: 1px solid var(--border); }
      .transport { margin-top: 24px; padding: 24px; background: #121513; border: 1px solid var(--border); border-radius: 6px; }
      .transport-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
      .transport-secondary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .empty-state { padding: 24px 0; color: var(--muted); font-size: 13px; }
      .about-copy { max-width: 680px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); line-height: 1.8; }
      .skip-link { position: fixed; top: -100px; left: 16px; z-index: 100; padding: 12px 18px; background: var(--amber); color: #171918; }
      .skip-link:focus { top: 12px; }

      @media (min-width: 1600px) { .page { padding-top: 40px; } }
      @media (max-width: 1100px) {
        .app-nav { width: 156px; } .app-shell { margin-left: 156px; }
        .page { padding: 24px; } .app-header { padding-inline: 24px; }
        .home-layout { gap: 24px; } .control-divider { display: none; }
        .tempo-control { margin-left: 0; }
      }
      @media (max-width: 760px) {
        .app-nav { inset: auto 0 0; width: auto; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); flex-direction: row; border-right: 0; border-top: 1px solid var(--border); }
        .brand, .nav-section, .nav-spacer, .nav-foot { display: none; }
        .rail-btn { flex: 1; justify-content: center; flex-direction: column; gap: 5px; padding: 9px 2px; font-size: 10px; }
        .rail-btn.active { box-shadow: inset 0 2px var(--amber); }
        .app-shell { margin-left: 0; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
        .app-header { min-height: 54px; padding: 14px 20px; } .header-context { display: none; }
        .page { padding: 24px 20px; } h1, .page-title { font-size: 24px; }
        .home-layout, .tuner-workspace, .jam-settings { grid-template-columns: 1fr; }
        .session-board { padding: 22px; } .session-title { font-size: 28px; }
        .tool-row:first-child { padding-top: 12px; }
        .tuner-workspace { padding: 20px; } .tuner-settings { border-left: 0; border-top: 1px solid var(--border); padding: 24px 0 0; }
        .jam-settings > section + section { border-left: 0; border-top: 1px solid var(--border); }
        .jam-settings > section, .transport { padding: 18px; }
        .control-deck { gap: 16px 12px; padding: 16px; }
        .control-deck > div:not(.tempo-control):not(.control-divider) { flex: 1 1 110px; min-width: max-content; }
        .drawing-toolbar { padding: 12px; } .toolbar-hint { flex-basis: 100%; }
        .fl-input, .fl-btn, .fl-btn-primary, .fl-btn-danger, .fl-switch { min-height: 44px; }
        .chord-grid { grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); }
        .transport-controls > button { width: 100%; }
        .transport-secondary { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

      .fretboard-focus-toolbar {
        display: flex; align-items: center;
        justify-content: space-between; flex-wrap: wrap; gap: 12px;
      }
      .fretboard-focus.is-expanded {
        position: fixed; inset: 0; z-index: 100;
        width: 100%; height: 100%; height: 100dvh;
        margin: 0; background: var(--bg); overflow: auto;
        padding: max(16px, env(safe-area-inset-top))
                 max(20px, env(safe-area-inset-right))
                 max(16px, env(safe-area-inset-bottom))
                 max(20px, env(safe-area-inset-left));
        display: flex; flex-direction: column;
      }
      .fretboard-focus:fullscreen { background: var(--bg); }
      .fretboard-focus.is-expanded .fretboard-focus-toolbar {
        flex: none; padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .fretboard-focus.is-expanded .fretboard-surface {
        flex: 1; min-height: 0; padding-block: 24px;
        align-content: center;
      }
      .fretboard-focus.is-expanded .wood > div {
        height: clamp(44px, 9vh, 84px);
      }

      .fretboard-focus .drawing-toolbar {
        flex-shrink: 0; margin-bottom: 0; padding: 12px 0;
        border: 0; border-bottom: 1px solid var(--border);
        border-radius: 0;
      }
      .fret-position[aria-disabled="true"] { cursor: default; }
      .fret-position[aria-disabled="false"] { cursor: pointer; }
      .fret-position .note-selected {
        outline: 2px solid var(--amber); outline-offset: 3px;
        box-shadow: 0 0 0 3px var(--bg) !important;
      }
      .note-selection-check {
        position: absolute; top: -5px; right: -5px;
        width: 14px; height: 14px; display: grid;
        place-items: center; border-radius: 50%;
        background: var(--amber); color: #171918;
        font-size: 10px; line-height: 1;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <script type="text/babel" data-presets="env,react">
      const { useState, useMemo } = React;

      // ---- Static music data ----
      const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

      const strings = [
        { name: 'e', openNote: 4 },
        { name: 'B', openNote: 11 },
        { name: 'G', openNote: 7 },
        { name: 'D', openNote: 2 },
        { name: 'A', openNote: 9 },
        { name: 'E', openNote: 4 }
      ];

      const scales = {
        major: [0, 2, 4, 5, 7, 9, 11],
        minor: [0, 2, 3, 5, 7, 8, 10],
        pentatonicMajor: [0, 2, 4, 7, 9],
        pentatonicMinor: [0, 3, 5, 7, 10],
        blues: [0, 3, 5, 6, 7, 10],
        dorian: [0, 2, 3, 5, 7, 9, 10],
        phrygian: [0, 1, 3, 5, 7, 8, 10],
        lydian: [0, 2, 4, 6, 7, 9, 11],
        mixolydian: [0, 2, 4, 5, 7, 9, 10],
        locrian: [0, 1, 3, 5, 6, 8, 10],
        harmonicMinor: [0, 2, 3, 5, 7, 8, 11],
        melodicMinor: [0, 2, 3, 5, 7, 9, 11]
      };

      const scaleNames = {
        major: 'Major',
        minor: 'Natural Minor',
        pentatonicMajor: 'Pentatonic Major',
        pentatonicMinor: 'Pentatonic Minor',
        blues: 'Blues',
        dorian: 'Dorian',
        phrygian: 'Phrygian',
        lydian: 'Lydian',
        mixolydian: 'Mixolydian',
        locrian: 'Locrian',
        harmonicMinor: 'Harmonic Minor',
        melodicMinor: 'Melodic Minor'
      };

      const tuningPresets = {
        standard: ['E', 'A', 'D', 'G', 'B', 'E'],
        dropD: ['D', 'A', 'D', 'G', 'B', 'E'],
        halfStepDown: ['D#', 'G#', 'C#', 'F#', 'A#', 'D#'],
      };

      const chordProgressions = [
        { name: 'I-V-vi-IV', romans: ['I', 'V', 'vi', 'IV'] },
        { name: 'I-vi-IV-V', romans: ['I', 'vi', 'IV', 'V'] },
        { name: 'vi-IV-I-V', romans: ['vi', 'IV', 'I', 'V'] },
        { name: 'I-V-IV-I', romans: ['I', 'V', 'IV', 'I'] },
        { name: 'ii-V-I', romans: ['ii', 'V', 'I'] },
        { name: 'Custom', romans: [] },
      ];

      const RailIcon = ({ children }) => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
      );
      const IconHome = () => <RailIcon><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></RailIcon>;
      const IconFret = () => <RailIcon><path d="M3 6h18M3 12h18M3 18h18M8 3v18M16 3v18" /></RailIcon>;
      const IconTuner = () => <RailIcon><path d="M12 3v10M12 13a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM8 5l4-2 4 2" /></RailIcon>;
      const IconJam = () => <RailIcon><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" /></RailIcon>;
      const IconInfo = () => <RailIcon><circle cx="12" cy="12" r="9" /><path d="M12 8h.01M12 12v4" /></RailIcon>;

      const Knob = ({ value, min, max }) => {
        const clamped = Math.max(min, Math.min(max, value));
        const angle = -135 + ((clamped - min) / (max - min)) * 270;
        return (
          <div className="knob" style={{ width: 44, height: 44 }}>
            <div className="knob-needle" style={{ transform: `translateX(-50%) rotate(${angle}deg)` }} />
          </div>
        );
      };

      const isLightColor = (hex) => {
        if (!hex || hex[0] !== '#' || hex.length < 7) return false;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return 0.299 * r + 0.587 * g + 0.114 * b > 150;
      };

      const romanForChord = (chord) => {
        const base = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][chord.degree - 1] || '';
        const q = chord.quality || '';
        const minorish = q === 'm' || q === 'm7' || q === 'dim' || q === 'dim7' || q === 'm7b5';
        let roman = minorish ? base.toLowerCase() : base;
        if (q === 'dim' || q === 'dim7') roman += '°';
        if (q === 'm7b5') roman += 'ø';
        return roman;
      };


      const FretboardFocus = ({ children, title }) => {
        const [expanded, setExpanded] = React.useState(false);
        const panelRef = React.useRef(null);
        const buttonRef = React.useRef(null);
        const wantsExpanded = React.useRef(false);
        const nativeActive = React.useRef(false);

        const close = async () => {
          wantsExpanded.current = false;
          if (document.fullscreenElement === panelRef.current) {
            try { await document.exitFullscreen(); }
            catch { wantsExpanded.current = true; return; }
          }
          setExpanded(false);
        };

        const open = () => {
          wantsExpanded.current = true;
          setExpanded(true);
          const panel = panelRef.current;
          if (panel.requestFullscreen) {
            try {
              Promise.resolve(panel.requestFullscreen()).then(() => {
                if (!wantsExpanded.current &&
                    document.fullscreenElement === panel) {
                  document.exitFullscreen().catch(() => setExpanded(true));
                }
              }).catch(() => {});
            } catch {}

          const deg = map[roman.replace('°','')] ?? 0;
          const note = scale[deg];
          const isDim = roman.includes('vii') || roman.includes('°');
          const isMinor = roman === roman.toLowerCase() && !isDim;

        const analyzeLoopEnvelope = (buffer) => {
          if (!buffer) return { start: 0, end: buffer ? buffer.duration : 0 };
          const sampleRate = buffer.sampleRate;
          const channelData = buffer.getChannelData(0);
          const windowSize = Math.max(1, Math.floor(sampleRate * 0.005));
          let maxAvg = 0;
          for (let i = 0; i < channelData.length; i += windowSize) {
            let sum = 0;
            for (let j = 0; j < windowSize && i + j < channelData.length; j++) {
              sum += Math.abs(channelData[i + j]);
            }
            const avg = sum / windowSize;
            if (avg > maxAvg) maxAvg = avg;
          }
          const threshold = Math.max(0.01, maxAvg * 0.3);
          let startSample = 0;
          for (let i = 0; i < channelData.length; i++) {
            if (Math.abs(channelData[i]) >= threshold) {
              startSample = Math.max(0, i - windowSize * 4);
              break;
            }
          }
          let endSample = channelData.length - 1;
          for (let i = channelData.length - 1; i >= 0; i--) {
            if (Math.abs(channelData[i]) >= threshold) {
              endSample = Math.min(channelData.length - 1, i + windowSize * 4);
              break;
            }
          }
          if (endSample <= startSample) {
            endSample = Math.min(channelData.length - 1, startSample + windowSize * 40);
          }
          return {
            start: startSample / sampleRate,
            end: Math.min(buffer.duration, (endSample + 1) / sampleRate),
          };
        };

        const quantizeWindowToGrid = (window, bpmValue, bufferDuration) => {
          const safeBpm = Math.max(20, Math.min(300, bpmValue));
          const beatSeconds = 60 / safeBpm;
          const grid = beatSeconds / LOOP_GRID_SUBDIVISIONS;
          const quantize = (time) => Math.round(time / grid) * grid;
          let start = Math.max(0, Math.min(bufferDuration - grid, quantize(window.start)));
          let end = Math.min(bufferDuration, Math.max(start + grid, quantize(window.end)));
          const beats = Math.max(1, Math.round((end - start) / beatSeconds));
          end = Math.min(bufferDuration, start + beats * beatSeconds);
          return { start, end, beats, beatSeconds };
        };

        const sliceAudioBuffer = (ctx, buffer, startSec, endSec) => {
          const sampleRate = buffer.sampleRate;
          const startSample = Math.max(0, Math.floor(startSec * sampleRate));
          const endSample = Math.min(buffer.length, Math.floor(endSec * sampleRate));
          const length = Math.max(1, endSample - startSample);
          const sliced = ctx.createBuffer(buffer.numberOfChannels, length, sampleRate);
          for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const source = buffer.getChannelData(channel);
            const target = sliced.getChannelData(channel);
            for (let i = 0; i < length; i++) {
              target[i] = source[startSample + i] || 0;
            }
          }
          return sliced;

        const applyCrossfadeToBuffer = (buffer, seconds = LOOP_CROSSFADE_TIME) => {
          const fadeSamples = Math.min(
            Math.floor(seconds * buffer.sampleRate),
            Math.floor(buffer.length / 2)
          );
          if (fadeSamples <= 1) return;
          for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const data = buffer.getChannelData(channel);
            for (let i = 0; i < fadeSamples; i++) {
              const fadeIn = i / fadeSamples;
              data[i] *= fadeIn;
              const fadeOutIndex = buffer.length - fadeSamples + i;
              const fadeOut = 1 - i / fadeSamples;
              if (fadeOutIndex >= 0 && fadeOutIndex < buffer.length) {
                data[fadeOutIndex] *= fadeOut;
              }

          }

            applyCrossfadeToBuffer(sliced);
            const wavBuffer = audioBufferToWav(sliced);
            const processedBlob = new Blob([wavBuffer], { type: 'audio/wav' });

        const undoTrim = async () => {

              jamModeRef.current.countdownTimeouts = [];
            }

          if (mr) {
            if (mr.state !== 'inactive') {
              mr.stop();

                tracks.forEach(t => t.stop());

        const playRecordedAudio = () => {

            setPlaybackTime(0);
            URL.revokeObjectURL(audioUrl);

            jamModeRef.current.sourceNode = null;

            setPlaybackTime(0);
            setIsPlaying(false);
            jamModeRef.current.sourceNode = null;
          });

          jamModeRef.current.sourceNode = audio;
          setIsPlaying(true);
        };

        const stopPlayback = () => {
          jamModeRef.current.shouldLoop = false;
          if (jamModeRef.current.loopTimeout) {
            clearTimeout(jamModeRef.current.loopTimeout);
            jamModeRef.current.loopTimeout = null;
          }
          if (jamModeRef.current.sourceNode) {
            jamModeRef.current.sourceNode.pause();
            jamModeRef.current.sourceNode.currentTime = 0;
            jamModeRef.current.sourceNode.onended = null;
            jamModeRef.current.sourceNode = null;
          }
          setPlaybackTime(0); // Reset indicator
          setIsPlaying(false);

            }
            if (jamModeRef.current.countdownTimeouts && jamModeRef.current.countdownTimeouts.length) {
              jamModeRef.current.countdownTimeouts.forEach(t => clearTimeout(t));
              jamModeRef.current.countdownTimeouts = [];
            }
            if (jamModeRef.current.mediaRecorder && jamModeRef.current.mediaRecorder.state !== 'inactive') {
              jamModeRef.current.mediaRecorder.stop();
            }
          };
        }, []);

        const noteNameToMidi = (name, octave) => {
          const idx = noteNames.indexOf(name);
          if (idx < 0) return null;
          return (octave + 1) * 12 + idx;
        };
        const midiToFreq = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
        const buildTargetFreqs = (presetKey) => {
          const baseOctavesStandard = [2,2,3,3,3,4];
          const names = tuningPresets[presetKey];
          if (!names) return [];
          const octaves = [...baseOctavesStandard];
          return names.map((n, i) => {
            const midi = noteNameToMidi(n, octaves[i]);
            return midi != null ? midiToFreq(midi) : null;
          });
        };
        const targetFreqs = buildTargetFreqs(tuning);

        const pluckRef = React.useRef({ audioCtx: null });
        const playPluck = (freq, idx = null) => {
          try {
            const ctx = pluckRef.current.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            pluckRef.current.audioCtx = ctx;

            const duration = 2.2;
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const osc3 = ctx.createOscillator();
            osc1.type = 'triangle';
            osc2.type = 'triangle';
            osc3.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 0.996, now);
            osc3.frequency.setValueAtTime(freq * 2, now);

            const lp1 = ctx.createBiquadFilter();
            lp1.type = 'lowpass';
            lp1.frequency.setValueAtTime(3000, now);
            lp1.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
            lp1.Q.setValueAtTime(0.8, now);

            const body1 = ctx.createBiquadFilter();
            body1.type = 'peaking';
            body1.frequency.setValueAtTime(180 + freq * 0.1, now);
            body1.gain.setValueAtTime(8, now);
            body1.Q.setValueAtTime(2, now);
            const body2 = ctx.createBiquadFilter();
            body2.type = 'peaking';
            body2.frequency.setValueAtTime(300 + freq * 0.15, now);
            body2.gain.setValueAtTime(6, now);
            body2.Q.setValueAtTime(1.5, now);

            const attackLen = 0.08 * ctx.sampleRate;
            const noiseBuf = ctx.createBuffer(1, attackLen, ctx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
              const t = i / ctx.sampleRate;
              data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 60) * (1 - t / 0.08);
            }
            const noise = ctx.createBufferSource();
            noise.buffer = noiseBuf;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.25, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            const damping = ctx.createGain();
            damping.gain.setValueAtTime(1, now);
            damping.gain.exponentialRampToValueAtTime(0.3, now + 0.5);
            damping.gain.exponentialRampToValueAtTime(0.001, now + duration);

            const gain = ctx.createGain();
            let baseVolume = 0.6;
            if (idx === 3 || idx === 4) baseVolume = 1.0;
            else if (idx === 2) baseVolume = 0.85;
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(baseVolume, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            const delay = ctx.createDelay(0.1);
            delay.delayTime.setValueAtTime(0.008, now);
            const feedback = ctx.createGain();
            feedback.gain.setValueAtTime(0.12, now);

            osc1.connect(lp1);
            osc2.connect(lp1);
            osc3.connect(lp1);
            noise.connect(noiseGain).connect(lp1);
            lp1.connect(body1).connect(body2).connect(damping).connect(delay);
            delay.connect(feedback).connect(delay);
            body2.connect(gain);
            delay.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc3.start(now);
            noise.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);
            osc3.stop(now + duration);
            noise.stop(now + 0.08);
          } catch (e) {}
        };

        const sampleRef = React.useRef({ audioCtx: null, cache: new Map() });
        const getStringNameAndOctave = (presetKey, idx) => {
          const baseOctavesStandard = [2,2,3,3,3,4];
          const names = tuningPresets[presetKey];
          if (!names || idx < 0 || idx >= names.length) return null;
          return { name: names[idx], octave: baseOctavesStandard[idx] };
        };
        const playStringSample = async (idx) => {
          try {
            const ctx = sampleRef.current.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            sampleRef.current.audioCtx = ctx;
            const info = getStringNameAndOctave(tuning, idx);
            if (!info) throw new Error('no note info');
            const folder = tuning in tuningPresets ? tuning : 'standard';
            const fileBase = `assets/samples/${folder}/${encodeURIComponent(info.name + info.octave)}`;
            const tryUrls = [`${fileBase}.mp3`, `${fileBase}.wav`];
            let buffer = null;
            for (const url of tryUrls) {
              const key = url;
              if (sampleRef.current.cache.has(key)) {
                buffer = sampleRef.current.cache.get(key);
                break;
              }
              const res = await fetch(url);
              if (res.ok) {
                const arr = await res.arrayBuffer();
                buffer = await ctx.decodeAudioData(arr.slice(0));
                sampleRef.current.cache.set(key, buffer);
                break;
              }
            }
            if (!buffer) throw new Error('sample not found');
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            const gain = ctx.createGain();
            let baseGain = 0.9;
            if (idx === 3 || idx === 4) baseGain = 1.7;
            else if (idx === 2) baseGain = 1.4;
            gain.gain.setValueAtTime(baseGain, ctx.currentTime);
            src.connect(gain).connect(ctx.destination);
            src.start();
            return true;
          } catch (e) {
            return false;
          }
        };
        const playStringSound = async (idx) => {
          const ok = await playStringSample(idx);
          if (!ok) {
            const tf = targetFreqs && targetFreqs[idx];
            if (tf) playPluck(tf, idx);
          }
        };

        React.useEffect(() => {
          setStringHoldStart(null);
          setStringConfirmed(false);
        }, [tuning, selectedString]);

        React.useEffect(() => {
          if (!isTunerOn) {
            setStringHoldStart(null);
            setStringConfirmed(false);
            return;
          }
          if (autoDetectString && tunerFreq > 0 && targetFreqs && targetFreqs.length === 6) {
            let bestIdx = selectedString;
            let bestDiff = Infinity;
            for (let i = 0; i < targetFreqs.length; i++) {
              const tf = targetFreqs[i];
              if (!tf) continue;
              const centsDiff = 1200 * Math.log2(tunerFreq / tf);
              const absDiff = Math.abs(centsDiff);
              if (absDiff < bestDiff) {
                bestDiff = absDiff;
                bestIdx = i;
              }
            }
            if (bestIdx !== selectedString) setSelectedString(bestIdx);
          }
          const target = tuningPresets[tuning][selectedString];
          const inTune = target && tunerNote === target && Math.abs(tunerCents) <= 5;
          if (inTune) {
            if (!stringHoldStart) {
              setStringHoldStart(performance.now());
            } else if (!stringConfirmed && performance.now() - stringHoldStart >= 3000) {
              setStringConfirmed(true);
            }
          } else {
            setStringHoldStart(null);
            setStringConfirmed(false);
          }
        }, [tunerNote, tunerCents, tunerFreq, tuning, selectedString, isTunerOn, stringHoldStart, stringConfirmed, autoDetectString, targetFreqs]);

        const freqToNoteInfo = (freq) => {
          if (!freq || !isFinite(freq) || freq <= 0) return null;
          const midi = Math.round(69 + 12 * Math.log2(freq / 440));
          const name = noteNames[(midi + 1200) % 12];
          const noteFreq = 440 * Math.pow(2, (midi - 69) / 12);
          const cents = Math.round(1200 * Math.log2(freq / noteFreq));
          return { name, freq: noteFreq, cents, midi };
        };

        const resetTunerSmoothing = () => {
          tunerSmoothRef.current = {
            freqSamples: [],
            centsSamples: [],
            sliderCents: 0,
            lastGoodTs: 0,
            lastNote: '-',
          };
        };

        const applyTunerSmoothing = (freq, info) => {
          if (!info) return;
          const smoothing = tunerSmoothRef.current;
          const pushSample = (arr, value) => {
            arr.push(value);
            if (arr.length > MAX_TUNER_HISTORY) arr.shift();
          };
          pushSample(smoothing.freqSamples, freq);
          pushSample(smoothing.centsSamples, Math.max(-50, Math.min(50, info.cents)));
          if (!smoothing.freqSamples.length || !smoothing.centsSamples.length) return;
          const avg = (arr) => arr.reduce((sum, val) => sum + val, 0) / arr.length;
          const avgFreq = avg(smoothing.freqSamples);
          const avgCents = avg(smoothing.centsSamples);
          smoothing.sliderCents = smoothing.sliderCents + TUNER_NEEDLE_SMOOTHING * (avgCents - smoothing.sliderCents);
          smoothing.lastGoodTs = performance.now();
          const averagedInfo = freqToNoteInfo(avgFreq) || info;
          if (averagedInfo) {
            smoothing.lastNote = averagedInfo.name;
            setTunerNote(averagedInfo.name);
          } else if (smoothing.lastNote) {
            setTunerNote(smoothing.lastNote);
          }
          setTunerFreq(avgFreq);
          setTunerCents(Math.max(-50, Math.min(50, smoothing.sliderCents)));
        };

        const decayTunerDisplay = () => {
          const smoothing = tunerSmoothRef.current;
          if (performance.now() - smoothing.lastGoodTs < TUNER_SIGNAL_HANG_MS) return;
          smoothing.freqSamples = [];
          smoothing.centsSamples = [];
          smoothing.sliderCents *= 0.85;
          if (Math.abs(smoothing.sliderCents) < 0.5) {
            smoothing.sliderCents = 0;
            smoothing.lastNote = '-';
            setTunerFreq(0);
            setTunerNote('-');
            setTunerCents(0);
          } else {
            setTunerCents(Math.max(-50, Math.min(50, smoothing.sliderCents)));
          }
        };

        const autoCorrelate = (buf, sampleRate) => {
          const SIZE = buf.length;
          let rms = 0;
          for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
          rms = Math.sqrt(rms / SIZE);
          if (rms < 0.008) return { freq: -1, rms };

          let r1 = 0, r2 = SIZE - 1, thres = 0.2;
          for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
          for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
          buf = buf.slice(r1, r2);
          const newSize = buf.length;
          const c = new Array(newSize).fill(0);
          for (let i = 0; i < newSize; i++) {
            for (let j = 0; j < newSize - i; j++) c[i] = c[i] + buf[j] * buf[j + i];
          }
          let d = 0; while (c[d] > c[d + 1]) d++;
          let maxval = -1, maxpos = -1;
          for (let i = d; i < newSize; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
          }
          let T0 = maxpos;
          if (T0 > 0 && T0 < newSize - 1) {
            const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            const a = (x1 + x3 - 2 * x2) / 2;
            const b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);
          }
          if (!T0 || !isFinite(T0)) return { freq: -1, rms };
          const freq = sampleRate / T0;
          if (!isFinite(freq)) return { freq: -1, rms };
          return { freq, rms };
        };

        const startTuner = async () => {
          try {
            setTunerError(null);
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);
            const buf = new Float32Array(analyser.fftSize);
            tunerRef.current = { audioCtx, analyser, source, stream, rafId: null, buf };
            resetTunerSmoothing();

            const tick = () => {
              analyser.getFloatTimeDomainData(buf);
              const { freq, rms } = autoCorrelate(buf, audioCtx.sampleRate);
              if (
                freq > 0 &&
                isFinite(freq) &&
                freq < 2000 &&
                rms >= MIN_TUNER_SIGNAL_RMS
              ) {
                const info = freqToNoteInfo(freq);
                if (info) {
                  applyTunerSmoothing(freq, info);
                }
              } else {
                decayTunerDisplay();
              }
              tunerRef.current.rafId = requestAnimationFrame(tick);
            };
            setIsTunerOn(true);
            tick();
          } catch (e) {
            setTunerError(String(e && e.message ? e.message : e));
            setIsTunerOn(false);
          }
        };

        const stopTuner = () => {
          const ref = tunerRef.current;
          if (ref.rafId) cancelAnimationFrame(ref.rafId);
          if (ref.stream) ref.stream.getTracks().forEach(t => t.stop());
          if (ref.audioCtx) ref.audioCtx.close();
          tunerRef.current = { audioCtx: null, analyser: null, source: null, stream: null, rafId: null, buf: null };
          resetTunerSmoothing();
          setIsTunerOn(false);
          setTunerFreq(0);
          setTunerNote('-');
          setTunerCents(0);
        };

        const handleSaveDrawing = () => {
          const hasMarks = drawings && Object.keys(drawings).length > 0;
          if (!hasMarks) {
            alert('Select notes on the fretboard before saving.');
            return;
          }
          const defaultLabel = `${rootNote} ${scaleNames[scaleType] || ''}`.trim() || 'Fretboard Sketch';
          const nameInput = window.prompt('Name this fretboard preset', defaultLabel);
          if (nameInput === null) return; // user cancelled
          const name = nameInput.trim() || defaultLabel;
          const snapshot = { ...drawings };
          setSavedDrawings((prev) => [
            ...prev,
            {
              id: Date.now(),
              name,
              data: snapshot,
              root: rootNote,
              scale: scaleType,
            },
          ]);
        };

        const loadSavedDrawing = (id) => {
          const entry = savedDrawings.find((d) => d.id === id);
          if (!entry) return;
          if (entry.root) setRootNote(entry.root);
          if (entry.scale) setScaleType(entry.scale);
          setPage('FretBoard');
          setDrawings({ ...entry.data });
        };

        const deleteSavedDrawing = (id) => {
          setSavedDrawings((prev) => prev.filter((entry) => entry.id !== id));
        };

        const getScaleNotes = useMemo(() => {
          const rootIndex = noteNames.indexOf(rootNote);
          const intervals = scales[scaleType];
          return intervals.map(interval => (rootIndex + interval) % 12);
        }, [rootNote, scaleType]);

        const isNoteInScale = (noteIndex) => {
          return getScaleNotes.includes(noteIndex % 12);
        };

        const getScaleDegree = (noteIndex) => {
          const normalizedNote = noteIndex % 12;
          const degreeIndex = getScaleNotes.indexOf(normalizedNote);
          return degreeIndex !== -1 ? degreeIndex + 1 : null;
        };

        const formatDegree = (degree, noteIndex) => {
          if (!degree) return null;

          const interval = scales[scaleType][degree - 1];
          const majorIntervals = scales.major;
          const majorIntervalForThisPosition = majorIntervals[Math.min(degree - 1, majorIntervals.length - 1)];

          if (interval < majorIntervalForThisPosition) {
            return `${degree}♭`;
          } else if (interval > majorIntervalForThisPosition) {
            return `${degree}♯`;
          }

          return degree;
        };

        const getNoteAtFret = (stringOpenNote, fret) => {
          return (stringOpenNote + fret) % 12;
        };

        const isRootNote = (noteIndex) => {
          return noteIndex % 12 === noteNames.indexOf(rootNote);
        };

        const isToneInChord = (noteIndex) => {
          if (!selectedChord || !selectedChord.pcs) return false;
          const normalizedNote = noteIndex % 12;
          return selectedChord.pcs.includes(normalizedNote);
        };

        const isChordRoot = (noteIndex) => {
          if (!selectedChord) return false;
          return (noteIndex % 12) === selectedChord.pcs[0];
        };

        const isChordThird = (noteIndex) => {
          if (!selectedChord || !selectedChord.pcs || selectedChord.pcs.length < 2) return false;
          return (noteIndex % 12) === selectedChord.pcs[1];
        };

        const rotateArray = (arr, start) => arr.slice(start).concat(arr.slice(0, start));
        const pcDistance = (a, b) => (b - a + 12) % 12;
        const intervalsToQualityTriad = (iv) => {
          const sig = iv.sort((x,y)=>x-y).join(',');
          if (sig === '0,4,7') return 'maj';
          if (sig === '0,3,7') return 'm';
          if (sig === '0,3,6') return 'dim';
          if (sig === '0,4,8') return 'aug';
          return '';
        };
        const intervalsToQualitySeventh = (iv) => {
          const sig = iv.sort((x,y)=>x-y).join(',');
          if (sig === '0,4,7,11') return 'maj7';
          if (sig === '0,4,7,10') return '7';
          if (sig === '0,3,7,10') return 'm7';
          if (sig === '0,3,6,10') return 'm7b5';
          if (sig === '0,3,6,9') return 'dim7';
          return '7';
        };
        const buildDiatonicChords = useMemo(() => {
          const scalePcs = getScaleNotes; // array of pitch classes (0-11)
          if (!scalePcs || scalePcs.length === 0) return [];
          const chords = [];
          for (let degree = 0; degree < scalePcs.length; degree++) {
            const rotated = rotateArray(scalePcs, degree);
            const stack = chordType === 'sevenths' ? [0,2,4,6] : [0,2,4];
            const chordPcs = stack.map(step => rotated[step % rotated.length]);
            const rootPc = chordPcs[0];
            const intervals = chordPcs.map(pc => pcDistance(rootPc, pc));
            const rootName = noteNames[rootPc];
            const quality = chordType === 'sevenths' ? intervalsToQualitySeventh(intervals) : intervalsToQualityTriad(intervals);
            chords.push({
              name: `${rootName}${quality}`,
              degree: degree + 1,
              pcs: chordPcs,
              quality,
            });
          }
          return chords;
        }, [getScaleNotes, chordType]);

        const visibleFretCount = Math.max(1, endFret - startFret + 1);
        const hasActiveDrawing = drawings && Object.keys(drawings).length > 0;

        return (
          <div className="min-h-screen">
            <a className="skip-link" href="#main-content">Skip to workspace</a>
            <nav className="app-nav" aria-label="Main navigation">
              <div className="brand"><span className="brand-mark" aria-hidden="true"><IconFret /></span>FretLab</div>
              <div className="nav-section">Practice studio</div>
              {[
                { key: 'Home', label: 'Workspace', Icon: IconHome },
                { key: 'FretBoard', label: 'Fretboard', Icon: IconFret },
                { key: 'Tuner', label: 'Tuner', Icon: IconTuner },
                { key: 'Jam Mode', label: 'Jam Mode', Icon: IconJam },
              ].map(({ key, label, Icon }) => (
                <button key={key} onClick={() => setPage(key)}
                  className={`rail-btn ${page === key ? 'active' : ''}`}
                  aria-current={page === key ? 'page' : undefined}>
                  <Icon /><span>{label}</span>
                </button>
              ))}
              <div className="nav-spacer" />
              <button onClick={() => setPage('About')} className={`rail-btn ${page === 'About' ? 'active' : ''}`}
                aria-current={page === 'About' ? 'page' : undefined}><IconInfo /><span>About</span></button>
              <div className="nav-foot">A little practice, every day.</div>
            </nav>
            <div className="app-shell">
              <header className="app-header">
                <span className="text-sm font-medium">{page === 'Home' ? 'Workspace' : page === 'FretBoard' ? 'Fretboard' : page}</span>
                <span className="header-context">Guitar practice studio</span>
                <div className="status" role="status">
                  <span className={`led ${isRecording ? 'rec' : ''}`} />
                  <span>{isRecording ? 'Recording' : isCountdownActive ? 'Count-in' : isTunerOn ? 'Listening' : isPlaying ? 'Playing' : isMetronomeOn ? 'Metronome on' : 'Ready'}</span>
                </div>
              </header>
              <main id="main-content" tabIndex={-1}>
              {/* ---------------- Home ---------------- */}
              {page === 'Home' && (
                <div className="page">
                  <div className="page-heading"><div>
                    <div className="eyebrow">Your workspace</div>
                    <h1>Make time to play.</h1>
                    <p className="page-description">Explore the neck, find your pitch, or work out an idea.</p>
                  </div></div>
                  <div className="home-layout">
                    <section className="session-board" aria-label="Current scale">
                      <div className="fl-label">On your fretboard</div>
                      <h2 className="session-title">{rootNote} {scaleNames[scaleType]}</h2>
                      <p className="text-sm text-[#b1b9af]">Find the connections between notes and chords.</p>
                      <div className="scale-strip" aria-label="Notes in the current scale">
                        {getScaleNotes.map(pc => <span key={pc}>{noteNames[pc]}</span>)}
                      </div>
                      <div className="session-meta"><span>{getScaleNotes.length} notes</span><span>Frets {startFret}–{endFret}</span><span>{bpm} BPM</span></div>
                      <button onClick={() => setPage('FretBoard')} className="fl-btn-primary h-11 px-5">Open fretboard <span aria-hidden="true">↗</span></button>
                    </section>
                    <section aria-label="Practice tools">
                      {[
                        { number: '01', title: 'Explore the fretboard', page: 'FretBoard', text: 'Scales, chord tones, and your own saved patterns.' },
                        { number: '02', title: 'Tune your guitar', page: 'Tuner', text: 'Live pitch detection and open-string reference tones.' },
                        { number: '03', title: 'Build a loop', page: 'Jam Mode', text: 'Set a tempo, record an idea, and play it back.' },
                      ].map(tool => <button key={tool.page} onClick={() => setPage(tool.page)} className="tool-row">
                        <span className="tool-number">{tool.number}</span><span><span className="tool-title">{tool.title}</span><span className="tool-copy block">{tool.text}</span></span><span className="tool-arrow" aria-hidden="true">↗</span>
                      </button>)}
                    </section>
                  </div>
                  <div className="session-footer"><span>{savedDrawings.length} saved pattern{savedDrawings.length === 1 ? '' : 's'}</span><span>{savedLoops.length} saved loop{savedLoops.length === 1 ? '' : 's'}</span><span>Saved on this browser</span></div>
                </div>
              )}

              {/* ---------------- Fretboard ---------------- */}
              {page === 'FretBoard' && (
                <div className="page">
                  <div className="page-heading"><div><h1>Fretboard explorer</h1><p className="page-description">Map a scale. Isolate a chord. Find your next phrase.</p></div><span className="fl-label">Standard tuning · 6 strings</span></div>
                  {/* Control deck */}
                  <div className="control-deck">
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Root note</label>
                      <select aria-label="Root note" value={rootNote} onChange={(e) => setRootNote(e.target.value)} className="fl-input h-9 px-3 text-sm">
                        {noteNames.map(note => <option key={note} value={note}>{note}</option>)}
                      </select>
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Scale</label>
                      <select aria-label="Scale" value={scaleType} onChange={(e) => setScaleType(e.target.value)} className="fl-input h-9 px-3 text-sm">

                      </select>

                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Chords</label>
                      <select aria-label="Chord type" value={chordType} onChange={(e) => setChordType(e.target.value)} className="fl-input h-9 px-3 text-sm">
                        <option value="triads">Triads</option>
                        <option value="sevenths">Sevenths</option>
                      </select>
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Display</label>
                      <div className="fl-switch h-9 items-center">
                        <button className={`px-4 h-full text-[12.5px] ${!showDegrees ? 'on' : ''}`} aria-pressed={!showDegrees} onClick={() => setShowDegrees(false)}>Notes</button>
                        <button className={`px-4 h-full text-[12.5px] ${showDegrees ? 'on' : ''}`} aria-pressed={showDegrees} onClick={() => setShowDegrees(true)}>Degrees</button>
                      </div>
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Frets</label>
                      <div className="flex items-center gap-1.5">
                        <input
                          aria-label="First fret" type="number" min="1" max="21" value={startFret}
                          onChange={(e) => {
                            const val = Math.max(1, Math.min(20, parseInt(e.target.value) || 1));
                            setStartFret(val);
                            if (val >= endFret) setEndFret(Math.min(21, val + 1));
                          }}
                          className="fl-input h-9 w-14 px-2 text-sm"
                        />
                        <span className="text-[#929e92]">–</span>
                        <input
                          aria-label="Last fret" type="number" min="1" max="21" value={endFret}
                          onChange={(e) => {
                            const val = Math.max(2, Math.min(21, parseInt(e.target.value) || 21));
                            setEndFret(val);
                            if (val <= startFret) setStartFret(Math.max(1, val - 1));
                          }}
                          className="fl-input h-9 w-14 px-2 text-sm"
                        />
                        <button onClick={() => { setStartFret(1); setEndFret(21); }} className="fl-btn h-9 px-3 text-xs" title="Show all frets">
                          All
                        </button>
                      </div>
                    </div>

                    <div className="control-divider" />

                    <div className="tempo-control">
                      <div className="flex flex-col items-center gap-1">
                        <Knob value={bpm} min={20} max={300} />
                        <label className="fl-label">Tempo</label>
                      </div>
                      <div className="flex flex-col gap-1.5">
                        <input
                          aria-label="Tempo in BPM" type="number" min="20" max="300" step="1" value={bpm} inputMode="numeric"
                          onChange={(e) => setBpm(Math.max(20, Math.min(300, parseInt(e.target.value) || 0)))}
                          onBlur={(e) => setBpm(Math.max(20, Math.min(300, parseInt(e.target.value) || 100)))}
                          className="fl-input h-9 w-[70px] px-2 text-sm text-center font-semibold"
                        />
                        {!isMetronomeOn ? (
                          <button onClick={startMetronome} className="fl-btn-primary h-8 px-2 text-xs">▶ Click</button>
                        ) : (
                          <button onClick={stopMetronome} className="fl-btn-danger h-8 px-2 text-xs">■ Stop</button>
                        )}
                      </div>
                    </div>

                    </div>
                  <details className="display-options">
                    <summary>Note appearance</summary>
                    <div className="display-options-content">
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Root color</label>
                      <input type="color" value={rootColor} onChange={(e) => setRootColor(e.target.value)}
                        className="fl-input h-9 w-12 p-1 cursor-pointer" aria-label="Pick root note color" />
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Note color</label>
                      <input type="color" value={noteColor} onChange={(e) => setNoteColor(e.target.value)}
                        className="fl-input h-9 w-12 p-1 cursor-pointer" aria-label="Pick scale note color" />
                    </div>
                    </div>
                  </details>

                  {/* Fretboard */}
                  <FretboardFocus title={`${rootNote} ${scaleNames[scaleType]}`}>

                  <div className="drawing-toolbar">
                    <span className="toolbar-hint" role="status">
                      {isSelecting
                        ? 'Click a note to select or deselect it.'
                        : 'Turn on Select to choose notes.'}
                      {' '}{Object.keys(drawings).length} selected
                    </span>
                    <button onClick={handleSaveDrawing}
                      disabled={!hasActiveDrawing}
                      className="fl-btn h-9 px-3.5 text-[13px]"
                      title="Save selected notes">
                      Save
                    </button>
                    <button onClick={() => setIsSelecting(value => !value)}
                      className={`h-9 px-3.5 text-[13px] ${isSelecting ? 'fl-btn-primary' : 'fl-btn'}`}
                      aria-pressed={isSelecting}
                      title="Toggle note selection">
                      Select
                    </button>
                    <button onClick={() => setDrawings({})}
                      className="fl-btn h-9 px-3.5 text-[13px]"
                      title="Deselect all notes">
                      Clear
                    </button>
                  </div>

                  <div className="fretboard-surface" tabIndex={0} role="region" aria-label="Guitar fretboard. Scroll horizontally to see all frets.">
                    <div style={{ minWidth: Math.max(340, visibleFretCount * 46 + 48) }}>
                      <div className="flex mb-2.5 pl-12">
                        {[...Array(21)].map((_, fret) => {
                          const fretNum = fret + 1;
                          if (fretNum < startFret || fretNum > endFret) return null;
                          return (
                            <div key={fret} className="text-center text-[11px] font-bold text-[#929e92]"
                              style={{ width: `${100 / visibleFretCount}%` }}>
                              {fretNum}
                            </div>
                          );
                        })}
                      </div>

                      <div className="wood overflow-hidden">
                        {strings.map((string, stringIndex) => (
                          <div key={stringIndex} className="flex items-center h-[52px]">
                            <div className="w-12 text-center font-semibold text-[13px] text-[#eceee8]/85 select-none">
                              {string.name}
                            </div>
                            <div className="flex flex-1 relative h-full">
                              <div
                                className="string-metal absolute left-0 right-0 top-1/2 -translate-y-1/2"
                                style={{ height: `${1 + stringIndex * 0.4}px` }}
                              ></div>

                              {[...Array(21)].map((_, fret) => {
                                const fretNum = fret + 1;
                                const noteIndex = getNoteAtFret(string.openNote, fretNum);
                                const inScale = isNoteInScale(noteIndex);
                                const degree = getScaleDegree(noteIndex);
                                const isHovered = hoveredNote === `${stringIndex}-${fretNum}`;

                                if (fretNum < startFret || fretNum > endFret) return null;

                                const drawKey = `${stringIndex}-${fretNum}`;
                                const isDrawn = drawings[drawKey];
                                const isVisibleNote = selectedChord
                                  ? isToneInChord(noteIndex) : inScale;

                                return (
                                  <button type="button"
                                    key={fret}
                                    aria-label={`String ${string.name}, fret ${fretNum}, ${noteNames[noteIndex]}${isDrawn ? ', selected' : ''}`}
                                    aria-pressed={Boolean(isDrawn)}
                                    tabIndex={isSelecting && isVisibleNote ? 0 : -1}
                                    aria-disabled={!isSelecting || !isVisibleNote}
                                    className="fret-position h-full flex items-center justify-center relative"
                                    style={{ width: `${100 / visibleFretCount}%` }}
                                    onMouseEnter={() => setHoveredNote(drawKey)}
                                    onMouseLeave={() => setHoveredNote(null)}
                                    onClick={() => {
                                      if (!isSelecting || !isVisibleNote) return;
                                      setDrawings(previous => {
                                        const next = { ...previous };
                                        if (next[drawKey]) delete next[drawKey];
                                        else next[drawKey] = true;
                                        return next;
                                      });
                                    }}
                                  >
                                    <div className="fret-wire absolute left-0 top-0 bottom-0"></div>



                                    {(() => {
                                      if (selectedChord) {
                                        const shouldShow = isToneInChord(noteIndex);
                                        if (!shouldShow) return null;
                                      } else if (!inScale) return null;

                                      const isChordRootNote = isChordRoot(noteIndex);
                                      const isChordThirdNote = isChordThird(noteIndex);
                                      const isScaleRootNote = isRootNote(noteIndex);

                                      let bgColor;
                                      let glow = false;
                                      if (selectedChord) {
                                        if (isChordRootNote) { bgColor = rootColor; glow = true; }
                                        else if (isChordThirdNote) bgColor = thirdColor;
                                        else bgColor = noteColor;
                                      } else {
                                        bgColor = isScaleRootNote ? rootColor : noteColor;
                                        glow = isScaleRootNote;
                                      }

                                      return (
                                        <div
                                          className={`relative z-10 w-9 h-9 rounded-full flex items-center justify-center text-[11px] font-semibold transition-transform  ${isDrawn ? 'note-selected' : glow ? 'note-root-glow' : ''} ${isHovered ? 'scale-110' : ''}`}
                                          style={{
                                            backgroundColor: bgColor,
                                            color: isLightColor(bgColor) ? '#2b1f10' : '#fff8ec'
                                          }}
                                        >
                                          {showDegrees ? formatDegree(degree, noteIndex) : noteNames[noteIndex]}
                                          {isDrawn && <span className="note-selection-check" aria-hidden="true">✓</span>}
                                        </div>
                                      );
                                    })()}

                                    {stringIndex === 2 && (fretNum === 3 || fretNum === 5 || fretNum === 7 || fretNum === 9 || fretNum === 15 || fretNum === 17 || fretNum === 19 || fretNum === 21) && (
                                      <div className="inlay-pearl absolute w-2.5 h-2.5 rounded-full"
                                        style={{ top: '50%', transform: 'translateY(-50%)' }}></div>
                                    )}
                                    {stringIndex === 3 && fretNum === 12 && (
                                      <div className="inlay-pearl absolute w-2.5 h-2.5 rounded-full"
                                        style={{ top: '30%', transform: 'translateY(-50%)' }}></div>
                                    )}
                                    {stringIndex === 2 && fretNum === 12 && (
                                      <div className="inlay-pearl absolute w-2.5 h-2.5 rounded-full"
                                        style={{ top: '70%', transform: 'translateY(-50%)' }}></div>
                                    )}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  </FretboardFocus>

                    <span className="legend-item"><span className="legend-dot" style={{ background: rootColor }} />Root</span>
                    {selectedChord && <span className="legend-item"><span className="legend-dot" style={{ background: thirdColor }} />Third</span>}
                    <span className="legend-item"><span className="legend-dot" style={{ background: noteColor }} />{selectedChord ? 'Chord tone' : 'Scale note'}</span>
                    <span>Scroll across the neck to see all selected frets.</span>
                  </div>
                  {/* Diatonic chords */}
                  <div className="mt-5">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="font-semibold text-[#eceee8]">
