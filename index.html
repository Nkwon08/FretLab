        };
        const targetFreqs = buildTargetFreqs(tuning);

        const pluckRef = React.useRef({ audioCtx: null });
        const playPluck = (freq, idx = null) => {
          try {
            const ctx = pluckRef.current.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            pluckRef.current.audioCtx = ctx;

            const duration = 2.2;
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const osc3 = ctx.createOscillator();
            osc1.type = 'triangle';
            osc2.type = 'triangle';
            osc3.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 0.996, now);
            osc3.frequency.setValueAtTime(freq * 2, now);

            const lp1 = ctx.createBiquadFilter();
            lp1.type = 'lowpass';
            lp1.frequency.setValueAtTime(3000, now);
            lp1.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
            lp1.Q.setValueAtTime(0.8, now);

            const body1 = ctx.createBiquadFilter();
            body1.type = 'peaking';
            body1.frequency.setValueAtTime(180 + freq * 0.1, now);
            body1.gain.setValueAtTime(8, now);
            body1.Q.setValueAtTime(2, now);
            const body2 = ctx.createBiquadFilter();
            body2.type = 'peaking';
            body2.frequency.setValueAtTime(300 + freq * 0.15, now);
            body2.gain.setValueAtTime(6, now);
            body2.Q.setValueAtTime(1.5, now);

            const attackLen = 0.08 * ctx.sampleRate;
            const noiseBuf = ctx.createBuffer(1, attackLen, ctx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
              const t = i / ctx.sampleRate;
              data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 60) * (1 - t / 0.08);
            }
            const noise = ctx.createBufferSource();
            noise.buffer = noiseBuf;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.25, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            const damping = ctx.createGain();
            damping.gain.setValueAtTime(1, now);
            damping.gain.exponentialRampToValueAtTime(0.3, now + 0.5);
            damping.gain.exponentialRampToValueAtTime(0.001, now + duration);

            const gain = ctx.createGain();
            let baseVolume = 0.6;
            if (idx === 3 || idx === 4) baseVolume = 1.0;
            else if (idx === 2) baseVolume = 0.85;
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(baseVolume, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            const delay = ctx.createDelay(0.1);
            delay.delayTime.setValueAtTime(0.008, now);
            const feedback = ctx.createGain();
            feedback.gain.setValueAtTime(0.12, now);

            osc1.connect(lp1);
            osc2.connect(lp1);
            osc3.connect(lp1);
            noise.connect(noiseGain).connect(lp1);
            lp1.connect(body1).connect(body2).connect(damping).connect(delay);
            delay.connect(feedback).connect(delay);
            body2.connect(gain);
            delay.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc3.start(now);
            noise.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);
            osc3.stop(now + duration);
            noise.stop(now + 0.08);
          } catch (e) {}
        };

        const sampleRef = React.useRef({ audioCtx: null, cache: new Map() });
        const getStringNameAndOctave = (presetKey, idx) => {
          const baseOctavesStandard = [2,2,3,3,3,4];
          const names = tuningPresets[presetKey];
          if (!names || idx < 0 || idx >= names.length) return null;
          return { name: names[idx], octave: baseOctavesStandard[idx] };
        };
        const playStringSample = async (idx) => {
          try {
            const ctx = sampleRef.current.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            sampleRef.current.audioCtx = ctx;
            const info = getStringNameAndOctave(tuning, idx);
            if (!info) throw new Error('no note info');
            const folder = tuning in tuningPresets ? tuning : 'standard';
            const fileBase = `assets/samples/${folder}/${encodeURIComponent(info.name + info.octave)}`;
            const tryUrls = [`${fileBase}.mp3`, `${fileBase}.wav`];
            let buffer = null;
            for (const url of tryUrls) {
              const key = url;
              if (sampleRef.current.cache.has(key)) {
                buffer = sampleRef.current.cache.get(key);
                break;
              }
              const res = await fetch(url);
              if (res.ok) {
                const arr = await res.arrayBuffer();
                buffer = await ctx.decodeAudioData(arr.slice(0));
                sampleRef.current.cache.set(key, buffer);
                break;
              }
            }
            if (!buffer) throw new Error('sample not found');
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            const gain = ctx.createGain();
            let baseGain = 0.9;
            if (idx === 3 || idx === 4) baseGain = 1.7;
            else if (idx === 2) baseGain = 1.4;
            gain.gain.setValueAtTime(baseGain, ctx.currentTime);
            src.connect(gain).connect(ctx.destination);
            src.start();
            return true;
          } catch (e) {
            return false;
          }
        };
        const playStringSound = async (idx) => {
          const ok = await playStringSample(idx);
          if (!ok) {
            const tf = targetFreqs && targetFreqs[idx];
            if (tf) playPluck(tf, idx);
          }
        };

        React.useEffect(() => {
          setStringHoldStart(null);
          setStringConfirmed(false);
        }, [tuning, selectedString]);

        React.useEffect(() => {
          if (!isTunerOn) {
            setStringHoldStart(null);
            setStringConfirmed(false);
            return;
          }
          if (autoDetectString && tunerFreq > 0 && targetFreqs && targetFreqs.length === 6) {
            let bestIdx = selectedString;
            let bestDiff = Infinity;
            for (let i = 0; i < targetFreqs.length; i++) {
              const tf = targetFreqs[i];
              if (!tf) continue;
              const centsDiff = 1200 * Math.log2(tunerFreq / tf);
              const absDiff = Math.abs(centsDiff);
              if (absDiff < bestDiff) {
                bestDiff = absDiff;
                bestIdx = i;
              }
            }
            if (bestIdx !== selectedString) setSelectedString(bestIdx);
          }
          const target = tuningPresets[tuning][selectedString];
          const inTune = target && tunerNote === target && Math.abs(tunerCents) <= 5;
          if (inTune) {
            if (!stringHoldStart) {
              setStringHoldStart(performance.now());
            } else if (!stringConfirmed && performance.now() - stringHoldStart >= 3000) {
              setStringConfirmed(true);
            }
          } else {
            setStringHoldStart(null);
            setStringConfirmed(false);
          }
        }, [tunerNote, tunerCents, tunerFreq, tuning, selectedString, isTunerOn, stringHoldStart, stringConfirmed, autoDetectString, targetFreqs]);

        const freqToNoteInfo = (freq) => {
          if (!freq || !isFinite(freq) || freq <= 0) return null;
          const midi = Math.round(69 + 12 * Math.log2(freq / 440));
          const name = noteNames[(midi + 1200) % 12];
          const noteFreq = 440 * Math.pow(2, (midi - 69) / 12);
          const cents = Math.round(1200 * Math.log2(freq / noteFreq));
          return { name, freq: noteFreq, cents, midi };
        };

        const resetTunerSmoothing = () => {
          tunerSmoothRef.current = {
            freqSamples: [],
            centsSamples: [],
            sliderCents: 0,
            lastGoodTs: 0,
            lastNote: '-',
          };
        };

        const applyTunerSmoothing = (freq, info) => {
          if (!info) return;
          const smoothing = tunerSmoothRef.current;
          const pushSample = (arr, value) => {
            arr.push(value);
            if (arr.length > MAX_TUNER_HISTORY) arr.shift();
          };
          pushSample(smoothing.freqSamples, freq);
          pushSample(smoothing.centsSamples, Math.max(-50, Math.min(50, info.cents)));
          if (!smoothing.freqSamples.length || !smoothing.centsSamples.length) return;
          const avg = (arr) => arr.reduce((sum, val) => sum + val, 0) / arr.length;
          const avgFreq = avg(smoothing.freqSamples);
          const avgCents = avg(smoothing.centsSamples);
          smoothing.sliderCents = smoothing.sliderCents + TUNER_NEEDLE_SMOOTHING * (avgCents - smoothing.sliderCents);
          smoothing.lastGoodTs = performance.now();
          const averagedInfo = freqToNoteInfo(avgFreq) || info;
          if (averagedInfo) {
            smoothing.lastNote = averagedInfo.name;
            setTunerNote(averagedInfo.name);
          } else if (smoothing.lastNote) {
            setTunerNote(smoothing.lastNote);
          }
          setTunerFreq(avgFreq);
          setTunerCents(Math.max(-50, Math.min(50, smoothing.sliderCents)));
        };

        const decayTunerDisplay = () => {
          const smoothing = tunerSmoothRef.current;
          if (performance.now() - smoothing.lastGoodTs < TUNER_SIGNAL_HANG_MS) return;
          smoothing.freqSamples = [];
          smoothing.centsSamples = [];
          smoothing.sliderCents *= 0.85;
          if (Math.abs(smoothing.sliderCents) < 0.5) {
            smoothing.sliderCents = 0;
            smoothing.lastNote = '-';
            setTunerFreq(0);
            setTunerNote('-');
            setTunerCents(0);
          } else {
            setTunerCents(Math.max(-50, Math.min(50, smoothing.sliderCents)));
          }
        };

        const autoCorrelate = (buf, sampleRate) => {
          const SIZE = buf.length;
          let rms = 0;
          for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
          rms = Math.sqrt(rms / SIZE);
          if (rms < 0.008) return { freq: -1, rms };

          let r1 = 0, r2 = SIZE - 1, thres = 0.2;
          for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
          for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
          buf = buf.slice(r1, r2);
          const newSize = buf.length;
          const c = new Array(newSize).fill(0);
          for (let i = 0; i < newSize; i++) {
            for (let j = 0; j < newSize - i; j++) c[i] = c[i] + buf[j] * buf[j + i];
          }
          let d = 0; while (c[d] > c[d + 1]) d++;
          let maxval = -1, maxpos = -1;
          for (let i = d; i < newSize; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
          }
          let T0 = maxpos;
          if (T0 > 0 && T0 < newSize - 1) {
            const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            const a = (x1 + x3 - 2 * x2) / 2;
            const b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);
          }
          if (!T0 || !isFinite(T0)) return { freq: -1, rms };
          const freq = sampleRate / T0;
          if (!isFinite(freq)) return { freq: -1, rms };
          return { freq, rms };
        };

        const startTuner = async () => {
          try {
            setTunerError(null);
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);
            const buf = new Float32Array(analyser.fftSize);
            tunerRef.current = { audioCtx, analyser, source, stream, rafId: null, buf };
            resetTunerSmoothing();

            const tick = () => {
              analyser.getFloatTimeDomainData(buf);
              const { freq, rms } = autoCorrelate(buf, audioCtx.sampleRate);
              if (
                freq > 0 &&
                isFinite(freq) &&
                freq < 2000 &&
                rms >= MIN_TUNER_SIGNAL_RMS
              ) {
                const info = freqToNoteInfo(freq);
                if (info) {
                  applyTunerSmoothing(freq, info);
                }
              } else {
                decayTunerDisplay();
              }
              tunerRef.current.rafId = requestAnimationFrame(tick);
            };
            setIsTunerOn(true);
            tick();
          } catch (e) {
            setTunerError(String(e && e.message ? e.message : e));
            setIsTunerOn(false);
          }
        };

        const stopTuner = () => {
          const ref = tunerRef.current;
          if (ref.rafId) cancelAnimationFrame(ref.rafId);
          if (ref.stream) ref.stream.getTracks().forEach(t => t.stop());
          if (ref.audioCtx) ref.audioCtx.close();
          tunerRef.current = { audioCtx: null, analyser: null, source: null, stream: null, rafId: null, buf: null };
          resetTunerSmoothing();
          setIsTunerOn(false);
          setTunerFreq(0);
          setTunerNote('-');
          setTunerCents(0);
        };

        const handleSaveDrawing = () => {
          const hasMarks = drawings && Object.keys(drawings).length > 0;
          if (!hasMarks) {
            alert('Draw on the fretboard before saving.');
            return;
          }
          const defaultLabel = `${rootNote} ${scaleNames[scaleType] || ''}`.trim() || 'Fretboard Sketch';
          const nameInput = window.prompt('Name this fretboard preset', defaultLabel);
          if (nameInput === null) return; // user cancelled
          const name = nameInput.trim() || defaultLabel;
          const snapshot = { ...drawings };
          setSavedDrawings((prev) => [
            ...prev,
            {
              id: Date.now(),
              name,
              data: snapshot,
              root: rootNote,
              scale: scaleType,
            },
          ]);
        };

        const loadSavedDrawing = (id) => {
          const entry = savedDrawings.find((d) => d.id === id);
          if (!entry) return;
          if (entry.root) setRootNote(entry.root);
          if (entry.scale) setScaleType(entry.scale);
          setPage('FretBoard');
          setDrawings({ ...entry.data });
        };

        const deleteSavedDrawing = (id) => {
          setSavedDrawings((prev) => prev.filter((entry) => entry.id !== id));
        };

        const getScaleNotes = useMemo(() => {
          const rootIndex = noteNames.indexOf(rootNote);
          const intervals = scales[scaleType];
          return intervals.map(interval => (rootIndex + interval) % 12);
        }, [rootNote, scaleType]);

        const isNoteInScale = (noteIndex) => {
          return getScaleNotes.includes(noteIndex % 12);
        };

        const getScaleDegree = (noteIndex) => {
          const normalizedNote = noteIndex % 12;
          const degreeIndex = getScaleNotes.indexOf(normalizedNote);
          return degreeIndex !== -1 ? degreeIndex + 1 : null;
        };

        const formatDegree = (degree, noteIndex) => {
          if (!degree) return null;

          const interval = scales[scaleType][degree - 1];
          const majorIntervals = scales.major;
          const majorIntervalForThisPosition = majorIntervals[Math.min(degree - 1, majorIntervals.length - 1)];
          
          if (interval < majorIntervalForThisPosition) {
            return `${degree}♭`;
          } else if (interval > majorIntervalForThisPosition) {
            return `${degree}♯`;
          }
          
          return degree;
        };

        const getNoteAtFret = (stringOpenNote, fret) => {
          return (stringOpenNote + fret) % 12;
        };

        const isRootNote = (noteIndex) => {
          return noteIndex % 12 === noteNames.indexOf(rootNote);
        };

        const isToneInChord = (noteIndex) => {
          if (!selectedChord || !selectedChord.pcs) return false;
          const normalizedNote = noteIndex % 12;
          return selectedChord.pcs.includes(normalizedNote);
        };

        const isChordRoot = (noteIndex) => {
          if (!selectedChord) return false;
          return (noteIndex % 12) === selectedChord.pcs[0];
        };

        const isChordThird = (noteIndex) => {
          if (!selectedChord || !selectedChord.pcs || selectedChord.pcs.length < 2) return false;
          return (noteIndex % 12) === selectedChord.pcs[1];
        };

        const rotateArray = (arr, start) => arr.slice(start).concat(arr.slice(0, start));
        const pcDistance = (a, b) => (b - a + 12) % 12;
        const intervalsToQualityTriad = (iv) => {
          const sig = iv.sort((x,y)=>x-y).join(',');
          if (sig === '0,4,7') return 'maj';
          if (sig === '0,3,7') return 'm';
          if (sig === '0,3,6') return 'dim';
          if (sig === '0,4,8') return 'aug';
          return '';
        };
        const intervalsToQualitySeventh = (iv) => {
          const sig = iv.sort((x,y)=>x-y).join(',');
          if (sig === '0,4,7,11') return 'maj7';
          if (sig === '0,4,7,10') return '7';
          if (sig === '0,3,7,10') return 'm7';
          if (sig === '0,3,6,10') return 'm7b5';
          if (sig === '0,3,6,9') return 'dim7';
          return '7';
        };
        const buildDiatonicChords = useMemo(() => {
          const scalePcs = getScaleNotes; // array of pitch classes (0-11)
          if (!scalePcs || scalePcs.length === 0) return [];
          const chords = [];
          for (let degree = 0; degree < scalePcs.length; degree++) {
            const rotated = rotateArray(scalePcs, degree);
            const stack = chordType === 'sevenths' ? [0,2,4,6] : [0,2,4];
            const chordPcs = stack.map(step => rotated[step % rotated.length]);
            const rootPc = chordPcs[0];
            const intervals = chordPcs.map(pc => pcDistance(rootPc, pc));
            const rootName = noteNames[rootPc];
            const quality = chordType === 'sevenths' ? intervalsToQualitySeventh(intervals) : intervalsToQualityTriad(intervals);
            chords.push({
              name: `${rootName}${quality}`,
              degree: degree + 1,
              pcs: chordPcs,
              quality,
            });
          }
          return chords;
        }, [getScaleNotes, chordType]);

        const visibleFretCount = Math.max(1, endFret - startFret + 1);
        const hasActiveDrawing = drawings && Object.keys(drawings).length > 0;

        return (
          <div className="min-h-screen">
            {/* Icon rail navigation */}
            <nav className="fixed top-0 bottom-0 left-0 w-16 bg-[#0f0d0b] border-r border-[#332b22] flex flex-col items-center py-4 gap-1.5 z-40">
              <div className="brand-mark w-9 h-9 rounded-full grid place-items-center text-[#2b1a05] font-black text-[13px] mb-3 select-none">
                FL
              </div>
              {[
                { key: 'Home', label: 'Home', Icon: IconHome },
                { key: 'FretBoard', label: 'Fretboard', Icon: IconFret },
                { key: 'Tuner', label: 'Tuner', Icon: IconTuner },
                { key: 'Jam Mode', label: 'Jam Mode', Icon: IconJam },
              ].map(({ key, label, Icon }) => (
                <button
                  key={key}
                  onClick={() => setPage(key)}
                  className={`rail-btn w-11 h-11 grid place-items-center ${page === key ? 'active' : ''}`}
                  title={label}
                  aria-label={label}
                >
                  <Icon />
                </button>
              ))}
              <div className="flex-1" />
              <button
                onClick={() => setPage('About')}
                className={`rail-btn w-11 h-11 grid place-items-center ${page === 'About' ? 'active' : ''}`}
                title="About"
                aria-label="About"
              >
                <IconInfo />
              </button>
            </nav>

            <div className="ml-16">
              {/* Top bar */}
              <header className="h-14 flex items-center justify-between px-7 border-b border-[#332b22] bg-[#151210]/90">
                <div className="flex items-baseline gap-2.5">
                  <span className="font-extrabold text-[15px] tracking-tight">FretLab</span>
                  <span className="text-[#6e6353]">/</span>
                  <span className="text-[#a89a86] text-sm">{page === 'FretBoard' ? 'Fretboard' : page}</span>
                </div>
                <div className="flex items-center gap-5">
                  {page === 'FretBoard' && (
                    <div className="flex items-center gap-2 fl-card px-3.5 py-1.5 text-[13px] text-[#a89a86]">
                      <span className="w-2 h-2 rounded-full bg-[#f59e0b] shadow-[0_0_8px_rgba(245,158,11,.7)]" />
                      Current scale <b className="text-[#efe7da] font-semibold">{rootNote} {scaleNames[scaleType]}</b>
                    </div>
                  )}
                  <div className="flex items-center gap-2">
                    <span className={`led ${isRecording ? 'rec' : ''}`} />
                    <span className="text-[11px] text-[#6e6353] uppercase tracking-widest font-bold">
                      {isRecording ? 'Rec' : 'Ready'}
                    </span>
                  </div>
                </div>
              </header>

              {/* ---------------- Home ---------------- */}
              {page === 'Home' && (
                <div className="max-w-5xl mx-auto px-8">
                  <div className="pt-20 pb-11 text-center">
                    <div className="inline-flex items-center gap-2 fl-card rounded-full px-4 py-1.5 text-[#fbbf24] text-xs font-bold tracking-widest uppercase mb-7">
                      <span className="led" /> Plugged in &amp; ready
                    </div>
                    <h1 className="text-5xl md:text-[52px] font-black tracking-tight leading-[1.05] mb-4">
                      Your practice room,<br />
                      <em className="not-italic text-[#fbbf24] [text-shadow:0_0_24px_rgba(245,158,11,.4)]">always open.</em>
                    </h1>
                    <p className="text-[#a89a86] text-[17px] leading-relaxed max-w-xl mx-auto">
                      FretLab puts a full fretboard atlas, a chromatic tuner, and a loop recorder on one
                      workbench — so every practice session starts in seconds, right in the browser.
                    </p>
                    <div className="flex flex-wrap justify-center gap-3 mt-8">
                      <button onClick={() => setPage('FretBoard')} className="fl-btn-primary h-11 px-7 rounded-[10px] text-[15px]">
                        Open Fretboard
                      </button>
                      <button onClick={() => setPage('Tuner')} className="fl-btn h-11 px-7 rounded-[10px] text-[15px]">
                        Tune Up
                      </button>
                      <button onClick={() => setPage('Jam Mode')} className="fl-btn h-11 px-7 rounded-[10px] text-[15px]">
                        Jam
                      </button>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pb-14">
                    {[
                      { glyph: '▦', title: 'Fretboard Explorer', page: 'FretBoard',
                        text: 'Every scale, mode, and diatonic chord mapped across 21 frets. Toggle degrees, draw your own patterns, save them for later.' },
                      { glyph: '◉', title: 'Chromatic Tuner', page: 'Tuner',
                        text: 'Mic-based pitch detection with auto string detect and reference tones. Standard, Drop D, and half-step down presets.' },
                      { glyph: '◎', title: 'Jam Mode', page: 'Jam Mode',
                        text: 'Record over a click track with a one-bar count-in. Loops are quantized to the grid and saved right in your browser.' },
                    ].map((card) => (
                      <button
                        key={card.title}
                        onClick={() => setPage(card.page)}
                        className="fl-panel relative p-6 pt-7 text-left cursor-pointer hover:brightness-110 transition"
                      >
                        <span className="screw" style={{ top: 10, left: 10 }} />
                        <span className="screw" style={{ top: 10, right: 10 }} />
                        <span className="screw" style={{ bottom: 10, left: 10 }} />
                        <span className="screw" style={{ bottom: 10, right: 10 }} />
                        <div className="text-[17px] font-extrabold text-[#f5e9d0] mb-2">
                          <span className="text-[#fbbf24] mr-2">{card.glyph}</span>{card.title}
                        </div>
                        <p className="text-[#a89a86] text-[13.5px] leading-relaxed">{card.text}</p>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* ---------------- Fretboard ---------------- */}
              {page === 'FretBoard' && (
                <div className="px-6 py-6 max-w-[1400px] mx-auto">
                  {/* Control deck */}
                  <div className="fl-panel flex flex-wrap items-end gap-x-5 gap-y-4 px-5 py-4 mb-5">
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Root note</label>
                      <select value={rootNote} onChange={(e) => setRootNote(e.target.value)} className="fl-input h-9 px-3 text-sm">
                        {noteNames.map(note => <option key={note} value={note}>{note}</option>)}
                      </select>
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Scale</label>
                      <select value={scaleType} onChange={(e) => setScaleType(e.target.value)} className="fl-input h-9 px-3 text-sm">
                        {Object.entries(scaleNames).map(([key, name]) => <option key={key} value={key}>{name}</option>)}
                      </select>
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Chords</label>
                      <select value={chordType} onChange={(e) => setChordType(e.target.value)} className="fl-input h-9 px-3 text-sm">
                        <option value="triads">Triads</option>
                        <option value="sevenths">Sevenths</option>
                      </select>
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Root color</label>
                      <input type="color" value={rootColor} onChange={(e) => setRootColor(e.target.value)}
                        className="fl-input h-9 w-12 p-1 cursor-pointer" aria-label="Pick root note color" />
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Note color</label>
                      <input type="color" value={noteColor} onChange={(e) => setNoteColor(e.target.value)}
                        className="fl-input h-9 w-12 p-1 cursor-pointer" aria-label="Pick scale note color" />
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Display</label>
                      <div className="fl-switch h-9 items-center">
                        <button className={`px-4 h-full text-[12.5px] ${!showDegrees ? 'on' : ''}`} onClick={() => setShowDegrees(false)}>Notes</button>
                        <button className={`px-4 h-full text-[12.5px] ${showDegrees ? 'on' : ''}`} onClick={() => setShowDegrees(true)}>Degrees</button>
                      </div>
                    </div>
                    <div className="flex flex-col gap-1.5">
                      <label className="fl-label">Frets</label>
                      <div className="flex items-center gap-1.5">
                        <input
                          type="number" min="1" max="21" value={startFret}
                          onChange={(e) => {
                            const val = Math.max(1, Math.min(20, parseInt(e.target.value) || 1));
                            setStartFret(val);
                            if (val >= endFret) setEndFret(Math.min(21, val + 1));
                          }}
                          className="fl-input h-9 w-14 px-2 text-sm"
                        />
                        <span className="text-[#6e6353]">–</span>
                        <input
                          type="number" min="1" max="21" value={endFret}
                          onChange={(e) => {
                            const val = Math.max(2, Math.min(21, parseInt(e.target.value) || 21));
                            setEndFret(val);
                            if (val <= startFret) setStartFret(Math.max(1, val - 1));
                          }}
                          className="fl-input h-9 w-14 px-2 text-sm"
                        />
                        <button onClick={() => { setStartFret(1); setEndFret(21); }} className="fl-btn h-9 px-3 text-xs" title="Show all frets">
                          All
                        </button>
                      </div>
                    </div>

                    <div className="w-px self-stretch bg-[#332b22] mx-1 hidden lg:block" />

                    <div className="flex items-end gap-3">
                      <div className="flex flex-col items-center gap-1">
                        <Knob value={bpm} min={20} max={300} />
                        <label className="fl-label">Tempo</label>
                      </div>
                      <div className="flex flex-col gap-1.5">
                        <input
                          type="number" min="20" max="300" step="1" value={bpm} inputMode="numeric"
                          onChange={(e) => setBpm(Math.max(20, Math.min(300, parseInt(e.target.value) || 0)))}
                          onBlur={(e) => setBpm(Math.max(20, Math.min(300, parseInt(e.target.value) || 100)))}
                          className="fl-input h-9 w-[70px] px-2 text-sm text-center font-semibold"
                        />
                        {!isMetronomeOn ? (
                          <button onClick={startMetronome} className="fl-btn-primary h-8 px-2 text-xs">▶ Click</button>
                        ) : (
                          <button onClick={stopMetronome} className="fl-btn-danger h-8 px-2 text-xs">■ Stop</button>
                        )}
                      </div>
                    </div>

                    <div className="ml-auto flex items-end gap-2">
                      <button
                        onClick={() => setDrawingMode(drawingMode === 'draw' ? null : 'draw')}
                        className={`h-9 px-3.5 text-[13px] rounded-lg ${drawingMode === 'draw' ? 'fl-btn-primary' : 'fl-btn'}`}
                        title="Draw on the fretboard"
                      >
                        ✏️ Draw
                      </button>
                      <button
                        onClick={() => setDrawingMode(drawingMode === 'erase' ? null : 'erase')}
                        className={`h-9 px-3.5 text-[13px] rounded-lg ${drawingMode === 'erase' ? 'fl-btn-danger' : 'fl-btn'}`}
                        title="Erase marks"
                      >
                        🧹 Erase
                      </button>
                      <button
                        onClick={handleSaveDrawing}
                        disabled={!hasActiveDrawing}
                        className="fl-btn-primary h-9 px-3.5 text-[13px]"
                        title="Save current diagram"
                      >
                        💾 Save
                      </button>
                      <button onClick={() => setDrawings({})} className="fl-btn h-9 px-3.5 text-[13px]" title="Clear all marks">
                        🔄 Clear
                      </button>
                    </div>
                  </div>

                  {/* Fretboard */}
                  <div className="fl-panel p-5 overflow-x-auto">
                    <div className="min-w-[900px]">
                      <div className="flex mb-2.5 pl-12">
                        {[...Array(21)].map((_, fret) => {
                          const fretNum = fret + 1;
                          if (fretNum < startFret || fretNum > endFret) return null;
                          return (
                            <div key={fret} className="text-center text-[11px] font-bold text-[#6e6353]"
                              style={{ width: `${100 / visibleFretCount}%` }}>
                              {fretNum}
                            </div>
                          );
                        })}
                      </div>

                      <div className="wood rounded-xl overflow-hidden">
                        {strings.map((string, stringIndex) => (
                          <div key={stringIndex} className="flex items-center h-[52px]">
                            <div className="w-12 text-center font-extrabold text-[13px] text-[#f5e9d0]/85 select-none">
                              {string.name}
                            </div>
                            <div className="flex flex-1 relative h-full">
                              <div
                                className="string-metal absolute left-0 right-0 top-1/2 -translate-y-1/2"
                                style={{ height: `${1 + stringIndex * 0.4}px` }}
                              ></div>

                              {[...Array(21)].map((_, fret) => {
                                const fretNum = fret + 1;
                                const noteIndex = getNoteAtFret(string.openNote, fretNum);
                                const inScale = isNoteInScale(noteIndex);
                                const degree = getScaleDegree(noteIndex);
                                const isHovered = hoveredNote === `${stringIndex}-${fretNum}`;

                                if (fretNum < startFret || fretNum > endFret) return null;

                                const drawKey = `${stringIndex}-${fretNum}`;
                                const isDrawn = drawings[drawKey];

                                return (
                                  <div
                                    key={fret}
                                    className="h-full flex items-center justify-center relative"
                                    style={{ width: `${100 / visibleFretCount}%` }}
                                    onMouseEnter={() => setHoveredNote(drawKey)}
                                    onMouseLeave={() => setHoveredNote(null)}
                                    onClick={() => {
                                      if (drawingMode === 'draw') {
                                        setDrawings({ ...drawings, [drawKey]: true });
                                      } else if (drawingMode === 'erase') {
                                        const newDrawings = { ...drawings };
                                        delete newDrawings[drawKey];
                                        setDrawings(newDrawings);
                                      }
                                    }}
                                  >
                                    <div className="fret-wire absolute left-0 top-0 bottom-0 w-[3px]"></div>

                                    {isDrawn && (
                                      <div className="absolute inset-1 border-[3px] border-[#fcd34d] rounded-lg pointer-events-none z-20 shadow-[0_0_10px_rgba(252,211,77,.4)]" />
                                    )}

                                    {(() => {
                                      if (selectedChord) {
                                        const shouldShow = isToneInChord(noteIndex);
                                        if (!shouldShow) return null;
                                      } else if (!inScale) return null;

                                      const isChordRootNote = isChordRoot(noteIndex);
                                      const isChordThirdNote = isChordThird(noteIndex);
                                      const isScaleRootNote = isRootNote(noteIndex);

                                      let bgColor;
                                      let glow = false;
                                      if (selectedChord) {
                                        if (isChordRootNote) { bgColor = rootColor; glow = true; }
                                        else if (isChordThirdNote) bgColor = thirdColor;
                                        else bgColor = noteColor;
                                      } else {
                                        bgColor = isScaleRootNote ? rootColor : noteColor;
                                        glow = isScaleRootNote;
                                      }

                                      return (
                                        <div
                                          className={`relative z-10 w-9 h-9 rounded-full flex items-center justify-center text-[11px] font-extrabold cursor-default transition-transform shadow-[0_2px_6px_rgba(0,0,0,.5)] ${glow ? 'note-root-glow' : ''} ${isHovered ? 'scale-110' : ''}`}
                                          style={{
                                            backgroundColor: bgColor,
                                            color: isLightColor(bgColor) ? '#2b1f10' : '#fff8ec'
                                          }}
                                        >
                                          {showDegrees ? formatDegree(degree, noteIndex) : noteNames[noteIndex]}
                                        </div>
                                      );
                                    })()}

                                    {stringIndex === 2 && (fretNum === 3 || fretNum === 5 || fretNum === 7 || fretNum === 9 || fretNum === 15 || fretNum === 17 || fretNum === 19 || fretNum === 21) && (
                                      <div className="inlay-pearl absolute w-2.5 h-2.5 rounded-full"
                                        style={{ top: '50%', transform: 'translateY(-50%)' }}></div>
                                    )}
                                    {stringIndex === 3 && fretNum === 12 && (
                                      <div className="inlay-pearl absolute w-2.5 h-2.5 rounded-full"
                                        style={{ top: '30%', transform: 'translateY(-50%)' }}></div>
                                    )}
                                    {stringIndex === 2 && fretNum === 12 && (
                                      <div className="inlay-pearl absolute w-2.5 h-2.5 rounded-full"
                                        style={{ top: '70%', transform: 'translateY(-50%)' }}></div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Diatonic chords */}
                  <div className="mt-5">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="font-extrabold text-[#f5e9d0]">
                        Chords in scale <span className="text-[#6e6353] font-semibold text-sm">({chordType})</span>
                      </h3>
                      {selectedChord && (
                        <button onClick={() => setSelectedChord(null)} className="fl-btn h-8 px-3.5 text-[12.5px]">
                          ✕ Clear selection
                        </button>
                      )}
                    </div>
                    <div className="flex flex-wrap gap-3">
                      {buildDiatonicChords.map((ch) => {
                        const isSel = selectedChord && selectedChord.name === ch.name;
                        return (
                          <div
                            key={`${ch.degree}-${ch.name}`}
                            onClick={() => setSelectedChord(isSel ? null : ch)}
                            className={`fl-card px-4 py-3 min-w-[126px] cursor-pointer transition ${
                              isSel ? 'border-[#f59e0b] shadow-[0_0_0_1px_#f59e0b,0_0_16px_rgba(245,158,11,.25)]' : 'hover:border-[#5a4c39]'
                            }`}
                          >
                            <div className="fl-label">{romanForChord(ch)}</div>
                            <div className="font-extrabold text-base text-[#f5e9d0] mt-0.5 mb-2">{ch.name}</div>
                            <div className="flex gap-1">
                              {ch.pcs.map((pc, idx) => {
                                const c = idx === 0 ? rootColor : (idx === 1 ? thirdColor : noteColor);
                                return (
                                  <div key={idx} className="w-[19px] h-[19px] rounded-full grid place-items-center text-[9px] font-extrabold"
                                    style={{ backgroundColor: c, color: isLightColor(c) ? '#2b1f10' : '#fff8ec' }}>
                                    {noteNames[pc]}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Saved fretboard notes */}
                  <div className="fl-panel mt-6 p-4">
                    <div className="flex items-center justify-between mb-3">
                      <div className="font-extrabold text-[#f5e9d0]">Saved fretboard notes</div>
                      <div className="text-xs text-[#6e6353]">Tap a saved set to load it.</div>
                    </div>
                    {savedDrawings.length === 0 ? (
                      <div className="text-sm text-[#a89a86]">No saved notes yet. Draw on the board, then hit 💾 Save.</div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {savedDrawings.map((preset) => {
                          const count = Object.keys(preset.data || {}).length;
                          return (
                            <div
                              key={preset.id}
                              onClick={() => loadSavedDrawing(preset.id)}
                              className="fl-card px-3.5 py-2.5 cursor-pointer hover:border-[#5a4c39] transition"
                            >
                              <div className="flex items-start justify-between gap-2">
                                <div className="font-bold text-sm truncate text-[#f5e9d0]">{preset.name}</div>
                                <button
                                  type="button"
                                  aria-label={`Delete ${preset.name}`}
                                  onClick={(e) => { e.stopPropagation(); deleteSavedDrawing(preset.id); }}
                                  className="text-[#6e6353] hover:text-[#f87356] px-1.5 rounded text-sm font-bold"
                                >
                                  ✕
                                </button>
                              </div>
                              <div className="text-xs mt-1 text-[#a89a86]">
                                {count} note{count === 1 ? '' : 's'} • {preset.root || rootNote} {scaleNames[preset.scale] || scaleNames[scaleType]}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ---------------- Tuner ---------------- */}
              {page === 'Tuner' && (
                <div className="max-w-5xl mx-auto px-8 py-10">
                  <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <div className="flex items-center gap-4">
                      <div className="text-2xl font-extrabold text-[#f5e9d0]">Chromatic Tuner</div>
                      <div className="fl-switch h-8 items-center">
                        <button className={`px-3.5 h-full text-xs ${autoDetectString ? 'on' : ''}`} onClick={() => setAutoDetectString(true)}>Auto detect</button>
                        <button className={`px-3.5 h-full text-xs ${!autoDetectString ? 'on' : ''}`} onClick={() => setAutoDetectString(false)}>Manual</button>
                      </div>
                    </div>
                    {!isTunerOn ? (
                      <button onClick={startTuner} className="fl-btn-primary h-10 px-6 text-sm">● Start tuning</button>
                    ) : (
                      <button onClick={stopTuner} className="fl-btn-danger h-10 px-6 text-sm">■ Stop</button>
                    )}
                  </div>

                  {tunerError && (
                    <div className="border border-[#9a3412] bg-[#2b1410] text-[#fca5a5] rounded-lg p-3 mb-4 text-sm">
                      Microphone error: {tunerError}
                    </div>
                  )}

                  <div className="fl-panel p-6 grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div className="md:col-span-2 flex flex-col items-center justify-center">
                      <div className="relative w-64 h-32">
                        <div className="absolute inset-0 flex items-end justify-center">
                          <div className="text-xs text-[#6e6353]">-50¢</div>
                          <div className="flex-1" />
                          <div className="text-xs text-[#6e6353]">+50¢</div>
                        </div>
                        <div className="absolute left-1/2 bottom-0 -translate-x-1/2 w-8 h-24 bg-green-500/20 rounded" />
                        <div
                          className="absolute left-1/2 bottom-0 -translate-x-1/2 w-1 h-24 bg-[#fbbf24] origin-bottom rounded shadow-[0_0_8px_rgba(251,191,36,.7)]"
                          style={{ transform: `translateX(-50%) rotate(${(tunerCents / 50) * 45}deg)` }}
                        />
                        <div className="absolute left-0 right-0 bottom-0 h-1.5 bg-[#332b22] rounded" />
                      </div>
                      <div className="mt-6 text-center">
                        <div className="fl-label">Detected</div>
                        <div className="text-[#f5e9d0] text-5xl font-black leading-tight">{tunerNote}</div>
                        <div className="text-sm mt-1 text-[#a89a86]">{tunerFreq ? tunerFreq.toFixed(1) + ' Hz' : '--'}</div>
                        <div className={`mt-2 text-sm font-bold ${Math.abs(tunerCents) <= 5 ? 'text-green-400' : 'text-[#fbbf24]'}`}>
                          {Math.abs(tunerCents) <= 5 ? 'In tune' : tunerCents < 0 ? `${Math.abs(tunerCents)}¢ flat` : `${tunerCents}¢ sharp`}
                        </div>
                        <div className="mt-4 flex flex-col items-center gap-1.5">
                          <div className="text-sm font-bold text-[#f5e9d0]">
                            Target: <span className="text-[#fbbf24]">{tuningPresets[tuning][selectedString]}</span>
                          </div>
                          <div className="w-40 h-2 rounded-full overflow-hidden bg-[#141110] border border-[#332b22]">
                            {(() => {
                              const start = stringHoldStart;
                              const progress = stringConfirmed ? 1 : (start ? Math.min(1, (performance.now() - start) / 3000) : 0);
                              const barColor = stringConfirmed ? 'bg-green-500' : 'bg-[#f59e0b]';
                              return <div className={`${barColor} h-full transition-[width]`} style={{ width: `${progress * 100}%` }} />;
                            })()}
                          </div>
                        </div>
                      </div>
                    </div>
                    <div className="space-y-3">
                      <div className="fl-label">Tuning</div>
                      <select
                        value={tuning}
                        onChange={(e) => setTuning(e.target.value)}
                        className="fl-input w-full h-9 px-3 text-sm"
                      >
                        <option value="standard">Standard (E A D G B E)</option>
                        <option value="dropD">Drop D (D A D G B E)</option>
                        <option value="halfStepDown">Half-step Down (D# G# C# F# A# D#)</option>
                      </select>

                      <div className="wood rounded-xl p-3 border border-[#453a2d]">
                        <div className="fl-label mb-2">Headstock</div>
                        <div className="relative w-72 h-44 mx-auto max-w-full">
                          <div className="absolute left-1/2 -translate-x-1/2 top-2 bottom-2 w-20 rounded-[24px] bg-[#241708] shadow-inner" />
                          <div className="absolute left-1/2 -translate-x-1/2 bottom-2 h-1 w-24 rounded bg-[#e8dcc0]" />

                          {(() => {
                            const positions = [
                              { idx: 0, side: 'left', top: '76%' },
                              { idx: 1, side: 'left', top: '50%' },
                              { idx: 2, side: 'left', top: '24%' },
                              { idx: 3, side: 'right', top: '24%' },
                              { idx: 4, side: 'right', top: '50%' },
                              { idx: 5, side: 'right', top: '76%' },
                            ];

                            return positions.map((p) => {
                              const open = tuningPresets[tuning][p.idx];
                              const isSelected = p.idx === selectedString;
                              const pillClass = isSelected
                                ? (stringConfirmed
                                    ? 'bg-green-600 text-white border-green-600'
                                    : 'bg-[#f59e0b] text-[#2b1a05] border-[#b45309] shadow-[0_0_10px_rgba(245,158,11,.5)]')
                                : 'bg-[#141110] text-[#efe7da] border-[#453a2d]';
                              const pegSideClass = p.side === 'left' ? 'left-3' : 'right-3';
                              const labelSideClass = p.side === 'left' ? 'left-12' : 'right-12';
                              const stringAnchorClass = p.side === 'left' ? 'left-[88px]' : 'right-[88px]';
                              return (
                                <div key={p.idx} className="absolute" style={{ top: p.top, left: 0, right: 0 }}>
                                  <div className={`string-metal absolute ${stringAnchorClass} h-0.5 w-16`} />
                                  <div className={`absolute ${pegSideClass} -translate-y-1/2`}>
                                    <div className="w-4 h-4 rounded-full shadow bg-gradient-to-br from-[#e8dcc0] to-[#8f8468]" />
                                  </div>
                                  <button
                                    type="button"
                                    className={`absolute ${labelSideClass} -translate-y-1/2 px-2.5 py-0.5 text-xs font-bold rounded-full border ${pillClass}`}
                                    onClick={() => {
                                      setSelectedString(p.idx);
                                      playStringSound(p.idx);
                                    }}
                                  >
                                    {open}
                                  </button>
                                </div>
                              );
                            });
                          })()}
                        </div>
                      </div>
                      <div className="text-xs text-[#6e6353] leading-relaxed">
                        Tap a string to hear its reference tone. Hold a string in tune for 3 seconds to lock it in.
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ---------------- Jam Mode ---------------- */}
              {page === 'Jam Mode' && (
                <div className="max-w-5xl mx-auto px-8 py-10">
                  <div className="text-2xl font-extrabold text-[#f5e9d0] mb-6">Jam Mode</div>

                  {isCountdownActive && countdown !== null && (
                    <div className="fixed inset-0 z-40 pointer-events-none flex items-center justify-center">
                      <div className="text-[8rem] md:text-[10rem] font-black text-[#fbbf24] [text-shadow:0_0_60px_rgba(245,158,11,.6)]">
                        {countdown}
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div className="fl-panel p-5">
                      <div className="fl-label mb-2">Key</div>
                      <select
                        value={selectedKey}
                        onChange={(e) => setSelectedKey(e.target.value)}
                        className="fl-input w-full h-10 px-3 text-sm"
                        disabled={isRecording || isCountdownActive}
                      >
                        {noteNames.map((key) => <option key={key} value={key}>{key}</option>)}
                      </select>
                      <div className="fl-label mt-5 mb-2">Chord progression</div>
                      <select
                        value={selectedProgression ?? ''}
                        onChange={(e) => setSelectedProgression(e.target.value === '' ? null : parseInt(e.target.value))}
                        className="fl-input w-full h-10 px-3 text-sm"
                      >
                        <option value="">None</option>
                        {chordProgressions.map((prog, idx) => <option key={idx} value={idx}>{prog.name}</option>)}
                      </select>
                      {selectedProgression !== null && chordProgressions[selectedProgression].romans.length > 0 && (
                        <div className="mt-3.5 flex flex-wrap gap-2">
                          {chordsForProgression(selectedKey, chordProgressions[selectedProgression].romans).map((chord, idx) => (
                            <div key={idx} className="fl-card px-3.5 py-1.5 font-bold text-[#f5e9d0] text-sm">
                              {chord}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="fl-panel p-5">
                      <div className="fl-label mb-3">Click track</div>
                      <div className="flex items-center gap-4 mb-4">
                        <Knob value={bpm} min={20} max={300} />
                        <input
                          type="number" min={20} max={300} value={bpm}
                          onChange={(e) => {
                            const v = Math.max(20, Math.min(300, Number(e.target.value) || 0));
                            setBpm(v);
                          }}
                          className="fl-input h-10 w-24 px-3 text-sm text-center font-semibold"
                        />
                        <div className="fl-switch h-9 items-center">
                          <button className={`px-4 h-full text-xs ${isMetronomeEnabled ? 'on' : ''}`} onClick={() => setIsMetronomeEnabled(true)}>On</button>
                          <button className={`px-4 h-full text-xs ${!isMetronomeEnabled ? 'on' : ''}`} onClick={() => setIsMetronomeEnabled(false)}>Off</button>
                        </div>
                      </div>
                      <div className="text-sm text-[#a89a86]">1 bar count-in at {bpm} BPM{isMetronomeEnabled ? ', click while recording' : ''}.</div>
                    </div>
                  </div>

                  <div className="mt-4 w-full max-w-2xl mx-auto text-center h-5">
                    {isLoopProcessing && (
                      <div className="text-sm font-bold text-[#fbbf24]">Quantizing…</div>
                    )}
                    {!isLoopProcessing && loopQuantizeInfo && (
                      <div className="text-sm text-[#a89a86]">
                        {loopQuantizeInfo.beats} beat{loopQuantizeInfo.beats === 1 ? '' : 's'} @ {loopQuantizeInfo.bpm} BPM
                      </div>
                    )}
                  </div>

                  <div className="mt-6 flex flex-col items-center">
                    <button
                      onClick={() => (isRecording || isCountdownActive) ? stopRecording() : startRecording()}
                      className={`h-12 px-8 rounded-[10px] text-[15px] ${(isRecording || isCountdownActive) ? 'fl-btn-danger' : 'fl-btn-primary'}`}
                      disabled={isCropping || isLoopProcessing}
                    >
                      {isCountdownActive ? '⏹ Cancel countdown' : isRecording ? '⏹ Stop recording' : '● Start recording'}
                    </button>

                    <div className="mt-4 flex flex-wrap justify-center items-center gap-2.5">
                      <button
                        onClick={() => isPlaying ? stopPlayback() : playRecordedAudio()}
                        disabled={!recordedAudio}
                        className={`h-10 px-5 rounded-lg ${isPlaying ? 'fl-btn-danger' : 'fl-btn'}`}
                      >
                        {isPlaying ? '⏸ Stop' : '▶ Play'}
                      </button>
                      <button
                        onClick={() => { const nl = !isLooping; setIsLooping(nl); jamModeRef.current.shouldLoop = nl; }}
                        disabled={!recordedAudio}
                        className={`h-10 px-5 rounded-lg ${isLooping ? 'fl-btn-primary' : 'fl-btn'}`}
                      >
                        {isLooping ? '🔁 Looping' : '🔁 Loop'}
                      </button>
                      <button
                        onClick={() => setShowCropUI(!showCropUI)}
                        disabled={!recordedAudio}
                        className={`h-10 px-5 rounded-lg ${showCropUI ? 'fl-btn-primary' : 'fl-btn'}`}
                      >
                        ✂ Edit
                      </button>
                      <button
                        onClick={() => saveLoopToDb()}
                        disabled={!recordedAudio}
                        className="fl-btn h-10 px-5 rounded-lg"
                      >
                        💾 Save loop
                      </button>
                    </div>
                  </div>

                  {showCropUI && recordedAudio && (
                    <div className="fl-panel p-5 mt-6 max-w-3xl mx-auto w-full">
                      <div className="font-extrabold text-[#f5e9d0] mb-1">Trim loop</div>
                      <div className="text-xs mb-3 text-[#6e6353]">Drag the handles to trim, drag the middle to move the selection.</div>

                      <div className="rounded-lg p-3 bg-[#141110] border border-[#332b22]">
                        <canvas id="waveform-canvas" width="800" height="140" className="w-full h-[140px] rounded bg-transparent cursor-pointer select-none touch-none" />
                      </div>

                      <div className="flex items-center gap-3 mt-4">
                        <button onClick={cropAudio} disabled={isCropping || isRecording} className="fl-btn-primary h-10 px-5 text-sm">
                          {isCropping ? 'Trimming…' : '✂ Apply trim'}
                        </button>
                        <button onClick={undoTrim} disabled={undoStack.length === 0 || isCropping || isRecording} className="fl-btn h-10 px-5 text-sm">
                          ↺ Undo
                        </button>
                        <div className="text-sm text-[#a89a86] ml-auto">Duration: {audioDuration.toFixed(2)}s</div>
                      </div>
                    </div>
                  )}

                  {savedLoops && savedLoops.length > 0 && (
                    <div className="mt-8">
                      <div className="font-extrabold text-[#f5e9d0] mb-3">Saved loops</div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {savedLoops.map(loop => (
                          <div key={loop.id} className="fl-card p-3.5 flex items-center justify-between gap-3">
                            <div className="min-w-0">
                              <div className="font-bold text-sm text-[#f5e9d0] truncate">{loop.name || 'Untitled loop'}</div>
                              <div className="text-xs text-[#a89a86] mt-0.5">
                                {loop.progressionName ? `${loop.progressionName} • ` : ''}Key {loop.key} • {loop.bpm} BPM
                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button onClick={() => loadLoop(loop.id)} className="fl-btn h-9 px-3.5 text-[13px]">Load</button>
                              <button onClick={() => deleteLoop(loop.id)} className="fl-btn-danger h-9 px-3.5 text-[13px]">Delete</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ---------------- About ---------------- */}
              {page === 'About' && (
                <div className="max-w-3xl mx-auto px-8 py-10">
                  <div className="text-2xl font-extrabold text-[#f5e9d0] mb-5">About</div>
                  <div className="fl-panel p-6 space-y-4 text-[#a89a86] leading-relaxed relative">
                    <span className="screw" style={{ top: 10, left: 10 }} />
                    <span className="screw" style={{ top: 10, right: 10 }} />
                    <span className="screw" style={{ bottom: 10, left: 10 }} />
                    <span className="screw" style={{ bottom: 10, right: 10 }} />
                    <p>
                      FretLab is a free, browser-based practice studio for guitarists. Visualize any scale or
                      diatonic chord across the full neck, tune up with the chromatic tuner, and record
                      quantized practice loops in Jam Mode — no installs, no accounts.
                    </p>
                    <p className="text-[#f5e9d0] font-semibold">Built by Nathan Kwon.</p>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      window.GuitarScaleExplorer = GuitarScaleExplorer;
    </script>

    <script type="text/babel">
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }
        componentDidCatch(error, info) {
          console.error('Render error:', error, info);
        }
        render() {
          if (this.state.hasError) {
            return (
              <div className="min-h-screen flex items-center justify-center bg-red-50 p-6">
                <div className="max-w-lg w-full bg-white shadow rounded-lg p-6 border border-red-200">
                  <h2 className="text-lg font-semibold text-red-700 mb-2">Something went wrong</h2>
                  <p className="text-sm text-red-600">{String(this.state.error)}</p>
                  <button
                    className="mt-4 px-4 py-2 rounded bg-red-600 text-white hover:bg-red-700"
                    onClick={() => window.location.reload()}
                  >
                    Reload
                  </button>
                </div>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function mountApp() {
        try {
          if (!window.GuitarScaleExplorer) {
            throw new Error('Component not loaded yet.');
          }
          const container = document.getElementById('root');
          if (!container) {
            throw new Error('Root container not found.');
          }
          const root = ReactDOM.createRoot(container);
          root.render(
            <ErrorBoundary>
              <GuitarScaleExplorer />
            </ErrorBoundary>
          );
        } catch (e) {
          console.error(e);
          const container = document.getElementById('root');
          if (container) {
            container.innerHTML = `
              <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff1f2;padding:24px;">
                <div style="max-width:640px;width:100%;background:#ffffff;border:1px solid #fecaca;border-radius:12px;padding:16px;font-family:ui-sans-serif,system-ui;">
                  <div style="font-weight:600;color:#b91c1c;margin-bottom:8px;">Failed to load the app</div>
                  <div style="color:#991b1b;font-size:14px;">${String(e)}</div>
                </div>
              </div>`;
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', mountApp);
      } else {
        mountApp();
      }
    </script>
  </body>
  </html>
